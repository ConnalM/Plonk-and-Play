; Disposable transport experiment, not the P&P firmware or a board decision.
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.partitions = default.csv
; All dependencies are already supplied by the installed Arduino ESP32 framework.
; No lib_deps: use its WiFi and ESP-IDF HTTP/WebSocket server directly.
