; Stage 15 Phase 8 hardware probe. This is deliberately separate from every
; Stage 14 environment and does not alter the product firmware path.
[env:stage15phase8s3sd]
platform = espressif32@6.9.0
board = esp32-8048s070
framework = arduino
monitor_speed = 115200
; The known-good physical Display3 project uses the board's UART0/USB-UART
; path (CDC-on-boot disabled). Keep this override local to the disposable
; probe; the shared board definition remains unchanged for Wokwi/product use.
build_flags = -Wall -Wextra -DPP_STAGE15_PHASE8_SD=1 -UARDUINO_USB_CDC_ON_BOOT -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps =
    https://github.com/moononournation/Arduino_GFX.git#v1.5.6
build_src_filter = +<phase8_sd_probe.cpp> -<main.cpp>

; Phase 8B-P1 real P&P persistence checkpoint. NVS remains for small
; controller state; the thin SD Store adapter backs versioned History/records.
; Transactional recovery is deliberately deferred to Phase 8B-P2.
[env:stage8bp1s3sd]
platform = espressif32@8.0.0
board = esp32-8048s070
framework = arduino
monitor_speed = 115200
# Keep the normal PlatformIO monitor visible while duplicating each session
# into firmware/logs/device-monitor-YYMMDD-HHMMSS.log.
monitor_filters = log2file
board_build.flash_mode = dio
build_unflags = -DARDUINO_USB_CDC_ON_BOOT=1
build_flags = -Wall -Wextra -DPP_PHASE8B_REAL_SD=1 -DPP_PHASE8B_P1_TEST=1 -DPP_MAX_ENTRIES=2 -DPP_MAX_SSE_CLIENTS=4 -DPP_WIFI_SCAN_INSTRUMENTATION=1 -Wl,--wrap=esp_wifi_scan_start -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps =
    https://github.com/moononournation/Arduino_GFX.git#v1.6.5
extra_scripts = pre:prebuild.py
build_src_filter = +<main.cpp> +<system_time.cpp> +<wifi_scan_instrumentation.cpp> -<phase8_sd_probe.cpp>

; Disposable full-P&P display startup-order discriminator. This preserves the
; production display object/configuration but starts its existing framebuffer
; before SD, Browser/AP/STA and HTTP startup, with boundary-only heap evidence.
[env:stage8bp1s3sd-display-order-probe]
extends = env:stage8bp1s3sd
build_flags = ${env:stage8bp1s3sd.build_flags} -DPP_DISPLAY_STARTUP_ORDER_PROBE=1

; Disposable full-image display discriminator. This retains the complete
; P&P link/global object set, draws READY at the early probe boundary, then
; safely idles before SD, Browser/AP/STA, HTTP, or later runtime startup.
[env:stage8bp1s3sd-display-full-image-early-stop]
extends = env:stage8bp1s3sd
build_flags = ${env:stage8bp1s3sd.build_flags} -DPP_DISPLAY_FULL_IMAGE_EARLY_STOP=1

; Disposable pre-Browser display discriminator. This retains normal NVS, SD,
; diagnostics and Message Bus startup, then idles immediately before Wi-Fi/AP/
; STA/mDNS and HTTP startup.
[env:stage8bp1s3sd-display-pre-browser-stop]
extends = env:stage8bp1s3sd
build_flags = ${env:stage8bp1s3sd.build_flags} -DPP_DISPLAY_PRE_BROWSER_STOP=1

; Disposable post-browser.begin display discriminator. This retains the early
; display and normal Wi-Fi/AP/STA/mDNS startup, then stops before first tick
; can start HTTP/SSE.
[env:stage8bp1s3sd-display-post-browser-begin-stop]
extends = env:stage8bp1s3sd
build_flags = ${env:stage8bp1s3sd.build_flags} -DPP_DISPLAY_POST_BROWSER_BEGIN_STOP=1

; Disposable AP-only display discriminator. This retains full P&P startup
; through WiFi mode/event/AP creation, then stops before remembered STA,
; mDNS, Browser tick and HTTP/SSE startup.
[env:stage8bp1s3sd-display-ap-only-stop]
extends = env:stage8bp1s3sd
build_flags = ${env:stage8bp1s3sd.build_flags} -DPP_DISPLAY_AP_ONLY_STOP=1

; Disposable migration-only RGB probe. This deliberately excludes the P&P
; application and every subsystem so framework/GFX scanout can be classified
; independently before any production display change.
[env:display-migration-probe]
platform = espressif32@8.0.0
board = esp32-8048s070
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
build_unflags = -DARDUINO_USB_CDC_ON_BOOT=1
build_flags = -Wall -Wextra -DPP_DISPLAY_MIGRATION_PROBE=1 -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps =
    https://github.com/moononournation/Arduino_GFX.git#v1.6.5
extra_scripts = pre:build_identity.py
build_src_filter = +<display_migration_probe.cpp> -<main.cpp> -<phase8_sd_probe.cpp>

; Phase 8A Wokwi Taster surface. This is a separate ESP32-S3 project and
; leaves the classic ESP32 Wokwi regression environment untouched.
[env:stage8atasterwokwi]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
build_flags = -Wall -Wextra -DPP_STAGE8A_TASTER_WOKWI=1 -DPP_WOKWI_DEV=1 -DPP_MAX_ENTRIES=2
