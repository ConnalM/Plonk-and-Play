[env:stage14cdemo]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DPP_STAGE14C_DEMO=1 -DPP_WOKWI_DEV=1

; Stage 15 Phase 8 hardware probe. This is deliberately separate from every
; Stage 14 environment and does not alter the product firmware path.
[env:stage15phase8s3sd]
platform = espressif32@6.9.0
board = esp32-8048s070
framework = arduino
monitor_speed = 115200
; The known-good physical Display3 project uses the board's UART0/USB-UART
; path (CDC-on-boot disabled). Keep this override local to the disposable
; probe; the shared board definition remains unchanged for Wokwi/product use.
build_flags = -Wall -Wextra -DPP_STAGE15_PHASE8_SD=1 -UARDUINO_USB_CDC_ON_BOOT -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps =
    https://github.com/moononournation/Arduino_GFX.git#v1.5.6
build_src_filter = +<phase8_sd_probe.cpp> -<main.cpp>

; Phase 8B-P1 real P&P persistence checkpoint. NVS remains for small
; controller state; the thin SD Store adapter backs versioned History/records.
; Transactional recovery is deliberately deferred to Phase 8B-P2.
[env:stage8bp1s3sd]
platform = espressif32@8.0.0
board = esp32-8048s070
framework = arduino
monitor_speed = 115200
# Keep the normal PlatformIO monitor visible while duplicating each session
# into firmware/logs/device-monitor-YYMMDD-HHMMSS.log.
monitor_filters = log2file
board_build.flash_mode = dio
build_unflags = -DARDUINO_USB_CDC_ON_BOOT=1
build_flags = -Wall -Wextra -DPP_PHASE8B_REAL_SD=1 -DPP_PHASE8B_P1_TEST=1 -DPP_MAX_ENTRIES=2 -DPP_MAX_SSE_CLIENTS=4 -DPP_WIFI_SCAN_INSTRUMENTATION=1 -Wl,--wrap=esp_wifi_scan_start -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps =
    https://github.com/moononournation/Arduino_GFX.git#v1.6.5
extra_scripts = pre:prebuild.py, post:app_descriptor_preimage.py
build_src_filter = +<main.cpp> +<system_time.cpp> +<wifi_scan_instrumentation.cpp> -<phase8_sd_probe.cpp>

; Disposable WP7 physical touch probe. This target reuses the validated
; ESP32-8048S070 Arduino_GFX panel wiring but does not include the product
; controller, SD owner, Browser or race path. It is intentionally separate
; from stage8bp1s3sd and is not a production image.
[env:stage8bp1s3sd-wp7-touch-test]
platform = espressif32@8.0.0
board = esp32-8048s070
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
build_unflags = -DARDUINO_USB_CDC_ON_BOOT=1
build_flags = -Wall -Wextra -DPP_PHASE8B_REAL_SD=1 -DPP_WP7_TOUCH_TEST=1 -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps =
    https://github.com/moononournation/Arduino_GFX.git#v1.6.5
build_src_filter = -<*> +<wp7_touch_probe.cpp>

; Disposable WP7 physical READY screen milestone. Reuses the validated RGB
; panel and GT911 touch adapter, but deliberately excludes the product
; controller, SD owner, Browser and race path.
[env:stage8bp1s3sd-wp7-ready-test]
platform = espressif32@8.0.0
board = esp32-8048s070
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
build_unflags = -DARDUINO_USB_CDC_ON_BOOT=1
build_flags = -Wall -Wextra -DPP_PHASE8B_REAL_SD=1 -DPP_WP7_READY_TEST=1 -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps =
    https://github.com/moononournation/Arduino_GFX.git#v1.6.5
build_src_filter = -<*> +<wp7_ready_probe.cpp>

; Disposable PSF.28 physical-acceptance build. The normal production
; stage8bp1s3sd environment above remains unchanged; this environment only
; enables the bounded, one-shot power-cut observation window.
[env:stage8bp1s3sd-psf28]
extends = env:stage8bp1s3sd
build_flags = ${env:stage8bp1s3sd.build_flags} -DPP_PSF28_ACCEPTANCE=1 -DPP_PSF28_WINDOW_MS=60000UL

; WP6 physical rollback acceptance candidate only.  This fixture overrides
; Arduino-ESP32 verifyOta() and is deliberately absent from stage8bp1s3sd.
[env:stage8bp1s3sd-wp6-rollback-acceptance]
extends = env:stage8bp1s3sd
build_flags = ${env:stage8bp1s3sd.build_flags} -DPP_WP6_ROLLBACK_ACCEPTANCE=1

; Development-only keyboard/simulated two-lane racing.  This environment is
; intentionally separate from production so the Browser controls and arm
; boundary cannot be shipped by stage8bp1s3sd.
[env:stage8bp1s3sd-simulated-racing]
extends = env:stage8bp1s3sd
build_flags = ${env:stage8bp1s3sd.build_flags} -DPP_SIMULATED_RACING_TEST=1

; Disposable physical WP7 racing milestone. Uses the real Arduino_GFX panel
; and GT911 surface with the normal Race Control/Input Module/Race Engine path.
; Keyboard 1/2 passages are accepted only while an explicitly simulated race
; is Racing, and simulated sessions never write official records.
[env:stage8bp1s3sd-wp7-physical-racing-test]
platform = espressif32@8.0.0
board = esp32-8048s070
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
build_unflags = -DARDUINO_USB_CDC_ON_BOOT=1
build_flags = -Wall -Wextra -DPP_WP7_PHYSICAL_RACING_TEST=1 -DPP_WP7_SINGLE_FB_RECOVERY=1 -DPP_WP7_DISABLE_ANIMATIONS=1 -DPP_UPDATE_TEST_KEY=1 -DPP_MAX_ENTRIES=2 -DPP_MAX_SSE_CLIENTS=4 -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps =
    https://github.com/moononournation/Arduino_GFX.git#v1.6.5
extra_scripts = pre:prebuild.py, post:app_descriptor_preimage.py
build_src_filter = +<main.cpp> +<system_time.cpp> +<wifi_scan_instrumentation.cpp> -<phase8_sd_probe.cpp>

; WP8 diagnostic comparison only.  It retains the complete physical racing
; path but keeps accepted READY settings in a verified RAM record so no NVS
; write/commit occurs during the controlled display-corruption comparison.
; Production and the normal physical racing-test environment do not define
; PP_WP8_NVS_DIAGNOSTIC.
[env:stage8bp1s3sd-wp8-nvs-diagnostic]
extends = env:stage8bp1s3sd-wp7-physical-racing-test
build_flags = ${env:stage8bp1s3sd-wp7-physical-racing-test.build_flags} -DPP_WP8_NVS_DIAGNOSTIC=1

; Disposable display-only diagnostic. This target does not include the P&P
; controller, SD owner, Browser, touch input or race path. It exercises the
; ESP-IDF RGB driver's own PSRAM framebuffers and frame-switch boundary while
; leaving the working WP7 racing environment unchanged.
[env:stage8bp1s3sd-wp7-double-buffer-diagnostic]
platform = espressif32@8.0.0
board = esp32-8048s070
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
build_unflags = -DARDUINO_USB_CDC_ON_BOOT=1
build_flags = -Wall -Wextra -DARDUINO_USB_CDC_ON_BOOT=0
build_src_filter = -<*> +<wp7_display_double_buffer_diag.cpp>

; Phase 8A Wokwi Taster surface. This is a separate ESP32-S3 project and
; leaves the classic ESP32 Wokwi regression environment untouched.
[env:stage8atasterwokwi]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
build_flags = -Wall -Wextra -DPP_STAGE8A_TASTER_WOKWI=1 -DPP_WOKWI_DEV=1 -DPP_UPDATE_TEST_KEY=1 -DPP_MAX_ENTRIES=2
extra_scripts = pre:build_identity.py
