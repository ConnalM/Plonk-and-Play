[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.partitions = default.csv
build_flags = -Wall -Wextra

[env:verification]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DPP_VERIFY=1

[env:quiet]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DPP_DIAGNOSTICS=0

[env:acceptance]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DPP_ACCEPTANCE=1

[env:stage2acceptance]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DPP_STAGE2_ACCEPTANCE=1

[env:stage3acceptance]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DPP_STAGE3_ACCEPTANCE=1

[env:stage4acceptance]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DPP_STAGE4_ACCEPTANCE=1

[env:stage5acceptance]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DPP_STAGE5_ACCEPTANCE=1

[env:stage6acceptance]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DPP_STAGE6_ACCEPTANCE=1

[env:stage6demo]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DPP_STAGE6_DEMO=1

[env:stage7acceptance]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DPP_STAGE7_ACCEPTANCE=1

[env:stage7demo]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DPP_STAGE7_DEMO=1

[env:stage8acceptance]
extends = env:esp32dev
; Stage 8's historical Browser fixture has a large in-image static fixture and
; is a two-entry regression. Keep that legacy test image within ESP32 DRAM;
; the product/default and Stage 14A acceptance images use PP_MAX_ENTRIES=8.
build_flags = ${env:esp32dev.build_flags} -DPP_STAGE8_ACCEPTANCE=1 -DPP_MAX_ENTRIES=2

[env:stage9acceptance]
extends = env:esp32dev
; Historical Stage 9 acceptance embeds a large two-entry fixture; keep that
; regression image bounded while the normal and Stage 14A images use capacity 8.
build_flags = ${env:esp32dev.build_flags} -DPP_STAGE9_ACCEPTANCE=1 -DPP_MAX_ENTRIES=2

[env:stage9demo]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DPP_STAGE9_DEMO=1

[env:stage10acceptance]
extends = env:esp32dev
; Stage 10's historical Browser fixture is a two-entry regression and has a
; large in-image authority/presentation harness; keep that image within DRAM.
build_flags = ${env:esp32dev.build_flags} -DPP_STAGE10_ACCEPTANCE=1 -DPP_MAX_ENTRIES=2

[env:stage10demo]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DPP_STAGE10_DEMO=1

[env:stage11acceptance]
extends = env:esp32dev
; Stage 11's acceptance fixture is intentionally the historical two-entry
; scenario. The Stage 14A image is the capacity-8 multi-entry proof.
build_flags = ${env:esp32dev.build_flags} -DPP_STAGE11_ACCEPTANCE=1 -DPP_MAX_ENTRIES=2

[env:stage11demo]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DPP_STAGE11_DEMO=1 -DPP_WOKWI_DEV=1

; Stable local-development target used by firmware/wokwi.toml.  Keep this
; separate from both the normal image and stage-specific acceptance images.
[env:wokwi-dev]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DPP_STAGE13_DEMO=1 -DPP_WOKWI_DEV=1

[env:stage12acceptance]
extends = env:esp32dev
; Stage 12's historical fixture constructs several complete two-entry
; harnesses simultaneously; keep that regression image within ESP32 DRAM.
build_flags = ${env:esp32dev.build_flags} -DPP_STAGE12_ACCEPTANCE=1 -DPP_MAX_ENTRIES=2

[env:stage12demo]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DPP_STAGE12_DEMO=1 -DPP_WOKWI_DEV=1

[env:stage13acceptance]
extends = env:esp32dev
; Stage 13's historical fixture also constructs several two-entry harnesses;
; Stage 14A proves the capacity-8 implementation separately.
build_flags = ${env:esp32dev.build_flags} -DPP_STAGE13_ACCEPTANCE=1 -DPP_MAX_ENTRIES=2

[env:stage13demo]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DPP_STAGE13_DEMO=1 -DPP_WOKWI_DEV=1

[env:stage14aacceptance]
extends = env:esp32dev
; The deterministic multi-entry acceptance probe is intentionally diagnostic
; and has a larger loop frame than product/demo firmware.  Give only this
; acceptance image the extra loop-task stack it needs; production images keep
; the platform default.
; The multi-entry fixture's single deterministic campaign frame is larger than
; the current Wokwi Arduino loop default.  This is acceptance-harness stack
; capacity only; product/demo firmware and race behaviour are unchanged.
build_flags = ${env:esp32dev.build_flags} -DPP_STAGE14A_ACCEPTANCE=1 -DARDUINO_LOOP_STACK_SIZE=32768

[env:stage14ademo]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DPP_STAGE14A_DEMO=1 -DPP_WOKWI_DEV=1

[env:stage14bacceptance]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DPP_STAGE14B_ACCEPTANCE=1 -DARDUINO_LOOP_STACK_SIZE=16384

[env:stage14bdemo]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DPP_STAGE14B_DEMO=1 -DPP_WOKWI_DEV=1

[env:stage14cacceptance]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DPP_STAGE14C_ACCEPTANCE=1 -DPP_MAX_ENTRIES=2 -DARDUINO_LOOP_STACK_SIZE=16384

[env:stage14cdemo]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DPP_STAGE14C_DEMO=1 -DPP_WOKWI_DEV=1
