[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.partitions = default.csv
build_flags = -Wall -Wextra

[env:verification]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DPP_VERIFY=1

[env:quiet]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DPP_DIAGNOSTICS=0

[env:acceptance]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DPP_ACCEPTANCE=1

[env:stage2acceptance]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DPP_STAGE2_ACCEPTANCE=1

[env:stage3acceptance]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DPP_STAGE3_ACCEPTANCE=1

[env:stage4acceptance]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DPP_STAGE4_ACCEPTANCE=1

[env:stage5acceptance]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DPP_STAGE5_ACCEPTANCE=1

[env:stage6acceptance]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DPP_STAGE6_ACCEPTANCE=1

[env:stage6demo]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DPP_STAGE6_DEMO=1

[env:stage7acceptance]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DPP_STAGE7_ACCEPTANCE=1

[env:stage7demo]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DPP_STAGE7_DEMO=1

[env:stage8acceptance]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DPP_STAGE8_ACCEPTANCE=1

[env:stage9acceptance]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DPP_STAGE9_ACCEPTANCE=1

[env:stage9demo]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DPP_STAGE9_DEMO=1

[env:stage10acceptance]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DPP_STAGE10_ACCEPTANCE=1

[env:stage10demo]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DPP_STAGE10_DEMO=1

[env:stage11acceptance]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DPP_STAGE11_ACCEPTANCE=1

[env:stage11demo]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DPP_STAGE11_DEMO=1 -DPP_WOKWI_DEV=1

; Stable local-development target used by firmware/wokwi.toml.  Keep this
; separate from both the normal image and stage-specific acceptance images.
[env:wokwi-dev]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DPP_STAGE12_DEMO=1 -DPP_WOKWI_DEV=1

[env:stage12acceptance]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DPP_STAGE12_ACCEPTANCE=1

[env:stage12demo]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DPP_STAGE12_DEMO=1 -DPP_WOKWI_DEV=1
