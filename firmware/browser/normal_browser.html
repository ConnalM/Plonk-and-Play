<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plonk & Play</title><style>:root{--b:#09111c;--p:#111c2b;--p2:#172437;--l:#2a394d;--t:#f4f6f8;--m:#9eacbd;--y:#ffd400}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:15px system-ui}.s{max-width:1280px;margin:auto;padding:0 22px 30px}.top{height:78px;display:flex;align-items:center;gap:28px;border-bottom:1px solid var(--l)}.logo{font-size:27px;font-weight:950;font-style:italic}.logo b{color:var(--y)}nav{display:flex;gap:22px;flex:1}button{font:inherit}.nav,.link{background:none;border:0;color:var(--m);font-weight:700;cursor:pointer}.status{text-align:right;font-weight:900}.reason{font-size:12px;color:var(--m)}.hero{padding:48px 0 24px}.eye{color:var(--y);font-size:13px;font-weight:900;letter-spacing:.13em}.hero h1{font-size:44px;margin:8px 0}.muted{color:var(--m)}.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:18px}.card{background:var(--p);border:1px solid var(--l);border-radius:12px;padding:20px}.btn{border:1px solid var(--l);background:var(--p2);color:var(--t);border-radius:7px;padding:10px 16px;font-weight:800;cursor:pointer}.primary{background:var(--y);border-color:var(--y);color:#111}.btn:disabled{opacity:.4}.big{width:100%;font-size:24px;padding:18px}.entries{display:grid;gap:8px}.entry{display:grid;grid-template-columns:80px 1fr;gap:12px;background:var(--p2);padding:12px;border-radius:8px}.lane{color:var(--y);font-weight:900}.modes{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:20px}.mode.on{border-color:var(--y);color:var(--y)}.mode.off{opacity:.35}.form{display:flex;gap:14px;align-items:center;margin:13px 0}.form label{min-width:150px;color:var(--m)}input,select{background:#0c1623;border:1px solid var(--l);color:var(--t);padding:10px;border-radius:6px}.race{padding-top:22px}.pod{background:#050a10;border:1px solid #34455a;border-radius:20px 20px 8px 8px;padding:18px;text-align:center}.lamps{display:flex;justify-content:center;gap:13px}.lamp{width:42px;height:42px;border-radius:50%;background:#222;border:4px solid #101010}.red.on{background:#e63c3c;box-shadow:0 0 16px #e63c3c}.green.on{background:#43c768;box-shadow:0 0 16px #43c768}.podstate{font-weight:950;letter-spacing:.14em;margin-top:9px}.clock{font-size:64px;font-weight:950;text-align:center;padding:20px}.bar{display:flex;justify-content:space-between;align-items:center;margin:14px 0}.table{border:1px solid var(--l);border-radius:10px;overflow:hidden}.tr{display:grid;grid-template-columns:80px 1.5fr 1fr 1fr 1fr 1fr;align-items:center;min-height:54px;padding:0 14px;border-top:1px solid var(--l)}.th{color:var(--m);font-size:12px;font-weight:800}.practice .tr{grid-template-columns:1.7fr 1fr 1fr 1fr}.overlay{position:fixed;inset:0;background:#050a10cc;display:grid;place-items:center}.dialog{width:min(440px,90vw);background:var(--p);border:1px solid var(--l);border-radius:14px;padding:28px;text-align:center}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.notice{position:fixed;right:20px;bottom:20px;background:var(--p2);border:1px solid var(--l);padding:12px 16px;border-radius:8px}.result{display:grid;grid-template-columns:80px 1.4fr 80px 1fr 1fr;gap:8px;padding:14px;border-top:1px solid var(--l)}.hide{display:none!important}@media(max-width:800px){nav{display:none}.grid{grid-template-columns:1fr}.tr{font-size:13px}}</style><div class="s"><header class="top" id="head"><div class="logo" id="logo"><b>P</b>&amp;<b>P</b></div><nav><button class="nav" id="setupNav">Race Setup</button><button class="nav" id="resultsNav">Results</button><button class="nav" disabled>Track Setup</button><button class="nav" disabled>Racers</button><button class="nav" disabled>Settings</button></nav><div><div class="status" id="status">CONNECTING</div><div class="reason" id="reason"></div></div></header><main id="app"></main></div><div id="overlay"></div><div id="notice" class="notice hide"></div><script>let S=null,P=null,C=null,V='home',busy=false,corr=1,polling=false,selectedHistorySequence=null,resultData=null,resultDataKey=null,detailsData=null,detailsDataKey=null,historyData=null,practiceData=null;const $=q=>document.querySelector(q),A=$('#app');const sec=u=>u?`${(+u/1e6).toFixed(2)} s`:'—',clock=u=>{let n=Math.max(0,Math.floor(+u/1e6));return`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`};const requestTimeoutMs=4000;async function G(p){const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),requestTimeoutMs);try{let r=await fetch(p,{cache:'no-store',signal:controller.signal});if(r.status===204)return null;if(!r.ok)throw Error(r.status);return r.json()}finally{clearTimeout(timeout)}}function name(m){return m==='OPEN_PRACTICE'?'OPEN PRACTICE':m==='ENDURANCE'?'ENDURANCE':m==='TIMED_STAGE'?'TIMED STAGE':m==='DRAG'?'DRAG':'LAP RACE'}function fp(x){return x==='COMPLETE_CURRENT_LAP'?1:x==='COMPLETE_FULL_RACE_DISTANCE'?2:0}function pe(){return(P?.entries||[]).map(e=>`<div class="entry"><div class="lane">LANE ${e.lane}</div><b>Racer ${e.mugId||e.index+1}</b></div>`).join('')}function readyText(){let c=P?.readinessContext?.code;return c==='INVALID_RACE_SETUP'?'Race setup needs attention':c==='CAPABILITY_UNAVAILABLE'?'Mode unavailable':c==='LIFECYCLE_NOT_STARTABLE'?'P&P is not ready to start':''}function header(){let active=S&&(['STARTING','RACING','PAUSED','RESTARTING'].includes(S.lifecycle)||S.finishDisplay?.active);$('#head').classList.toggle('hide',!!active);if(!active){if(S?.lifecycle==='FINISHED'&&!S.finishDisplay?.active&&(V==='results'||S.resultSealed)){$('#status').textContent='RESULTS';$('#reason').textContent='';return}$('#status').textContent=P?.startable?'READY':'NOT READY';$('#reason').textContent=P?.startable?'':readyText()}}function home(){let d=P.mode==='ENDURANCE'?`${P.durationMinutes} MINUTES`:P.mode==='OPEN_PRACTICE'?'OPEN SESSION':`${P.lapTarget} LAPS`;A.innerHTML=`<section class="hero"><div class="eye">${P.startable?'READY TO RACE':'NOT READY'}</div><h1>${name(P.mode)}</h1><div class="muted">${d}</div></section><div class="grid"><section class="card"><h2>Race Entries</h2><div class="entries">${pe()}</div></section><section class="card"><button class="btn primary big" id="start">${busy?'STARTING…':'START'}</button><button class="link" id="change">Change Race</button><p class="muted">${P.startable?'':'FIX · '+readyText()}</p></section></div>`;$('#start').disabled=busy||!C?.hasMaster||!P.startable;$('#start').onclick=()=>req('/request/start',{},true);$('#change').onclick=()=>{V='setup';render()}}function mb(m,l){let x=(P.supportedModes||[]).find(x=>x.mode===m),ok=!!x?.available;return`<button class="btn mode ${P.mode===m?'on':''} ${ok?'':'off'}" data-m="${m}" ${ok?'':'disabled'}>${l}${ok?'':' · Not yet available'}</button>`}function setup(){A.innerHTML=`<section class="hero"><div class="eye">RACE SETUP</div><h1>What are we racing?</h1></section><section class="card"><div class="modes">${mb('LAP_RACE','Lap Race')}${mb('OPEN_PRACTICE','Practice')}${mb('ENDURANCE','Endurance')}${mb('TIMED_STAGE','Timed Stage')}${mb('DRAG','Drag')}</div><div id="fields"></div><h2>Race Entries</h2><div class="entries">${pe()}</div><div class="actions"><button class="btn" id="back">Back</button><button class="btn primary" id="start">START</button></div></section>`;document.querySelectorAll('[data-m]:not(:disabled)').forEach(b=>b.onclick=()=>change({mode:b.dataset.m}));$('#back').onclick=()=>{V='home';render()};$('#start').onclick=()=>req('/request/start',{},true);fields()}function fields(){let b=$('#fields');if(P.mode==='OPEN_PRACTICE')b.innerHTML='<div class="form"><label>Practice type</label><b>OPEN</b></div><p class="muted">No time limit. End the session when finished.</p>';else if(P.mode==='ENDURANCE')b.innerHTML=`<div class="form"><label>Duration</label><input id="duration" type="number" min="1" max="999" value="${P.durationMinutes}"> minutes</div><div class="form"><label>At zero</label><select id="finish"><option value="0">Stop at zero</option><option value="1" ${P.finishBehaviour==='COMPLETE_CURRENT_LAP'?'selected':''}>Finish current lap</option></select></div>`;else b.innerHTML=`<div class="form"><label>Race distance</label><input id="laps" type="number" min="1" max="999" value="${P.lapTarget}"> laps</div><div class="form"><label>Winner finishes</label><select id="finish"><option value="0">All stop immediately</option><option value="1" ${P.finishBehaviour==='COMPLETE_CURRENT_LAP'?'selected':''}>Others finish current lap</option><option value="2" ${P.finishBehaviour==='COMPLETE_FULL_RACE_DISTANCE'?'selected':''}>Others complete total laps</option></select></div>`;if($('#duration'))$('#duration').onchange=()=>change({durationMinutes:Math.max(1,Math.min(999,+$('#duration').value||1))});if($('#laps'))$('#laps').onchange=()=>change({lapTarget:Math.max(1,Math.min(999,+$('#laps').value||1))});if($('#finish'))$('#finish').onchange=()=>change({finishPolicy:+$('#finish').value})}async function change(x){await req('/request/setup',{mode:P.mode,lapTarget:P.lapTarget,durationMinutes:P.durationMinutes,finishPolicy:fp(P.finishBehaviour),proposalRevision:P.proposalRevision,...x},true)}function pod(){let p=S.startPresentation||{},n=5,lit=+p.redLightsLit||0,phase=p.phase||'NONE';let rs=Array.from({length:n},(_,i)=>{let c=p.green?'green on':i<lit?'red on':'';return`<i class="lamp ${c}"></i>`}).join(''),label=S.finishDisplay?.active?'FINISHED':phase==='RESUME_COUNTDOWN'?'RESUMING':phase==='COUNTDOWN'?'STARTING':phase==='GO'?'GO':S.lifecycle;return`<div class="pod"><div class="lamps">${rs}</div><div class="podstate">${label}</div></div>`}function gap(e){return +e.lapsBehind?`+${e.lapsBehind} L`:'—'}function race(){let pr=S.sessionMode==='OPEN_PRACTICE',en=S.sessionMode==='ENDURANCE';let rows=(S.entries||[]).map(e=>pr?`<div class="tr"><b>Lane ${e.lane} · Racer ${e.raceEntryId}</b><div>${e.laps}</div><div>${sec(e.lastLapTime)}</div><div>${sec(e.bestLapTime)}</div></div>`:`<div class="tr"><div>${e.position||'—'}</div><b>Lane ${e.lane} · Racer ${e.raceEntryId}</b><div>${en?e.laps:`${e.laps} / ${S.lapTarget}`}</div><div>${sec(e.lastLapTime)}</div><div>${sec(e.bestLapTime)}</div><div>${gap(e)}</div></div>`).join('');let th=pr?'<div class="tr th"><div>LANE / RACER</div><div>LAPS</div><div>LAST</div><div>BEST</div></div>':'<div class="tr th"><div>POSITION</div><div>LANE / RACER</div><div>'+(en?'LAPS':'PROGRESS')+'</div><div>LAST</div><div>BEST</div><div>GAP</div></div>';A.innerHTML=`<section class="race ${pr?'practice':''}">${pod()}${en?`<div class="clock">${clock(S.remainingDuration)}</div>`:''}<div class="bar"><b>${pr?'OPEN PRACTICE':en?'ENDURANCE · '+(S.finishBehaviour==='COMPLETE_CURRENT_LAP'?'FINISH CURRENT LAP':'STOP AT ZERO'):'LAP RACE'}</b><div>${S.lifecycle==='RACING'&&!S.finishDisplay?.active?`<button class="btn" id="pause">${busy?'PAUSING\u2026':'PAUSE'}</button>${en?` <button class="btn primary" id="endRace">${busy?'ENDING\u2026':'END RACE'}</button>`:''}`:''}${S.finishDisplay?.active?'<button class="btn primary" id="skip">RESULTS ›</button>':''}</div></div><div class="table">${th}${rows}</div></section>`;if($('#pause'))$('#pause').onclick=()=>req('/request/pause');if($('#end'))$('#end').onclick=()=>req('/request/end-session');if($('#endRace'))$('#endRace').onclick=()=>destruct('/request/end-race','/request/end-race/confirm','End race');if($('#skip'))$('#skip').onclick=()=>req('/request/skip-finish-display')}function paused(){race();$('#overlay').innerHTML=`<div class="overlay"><div class="dialog"><h2>RACE PAUSED</h2><div class="actions"><button class="btn primary" id="resume">RESUME</button><button class="btn" id="restart">RESTART</button><button class="btn" id="abandon">ABANDON</button></div></div></div>`;$('#resume').onclick=()=>req('/request/resume');$('#restart').onclick=()=>destruct('/request/restart-race','/request/restart-race/confirm','Restart race');$('#abandon').onclick=()=>destruct('/request/end-race','/request/end-race/confirm','Abandon race')}async function destruct(a,b,l){if(!confirm(`${l}?`))return;let id=corr++,r=await fetch(a,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({correlationId:id})});if(!r.ok)return note(`${l} unavailable.`);r=await fetch(b,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({correlationId:id})});if(r.status===202)await wait(id)}function renderResults(r){let rows=(r.entries||[]).map(e=>`<div class="result"><b>${e.tied?'=':''}${e.rank}</b><b>Racer ${e.raceEntryId}</b><div>Lane ${e.lane}</div><div>${e.completed?sec(e.completionTime):e.classifiedLaps+' laps'}${e.lapPenalty?' · penalty '+e.lapPenalty:''}</div><div>${sec(e.bestLap)}</div></div>`).join('');A.innerHTML=`<section class="hero"><div class="eye">RESULTS</div><h1>${name(r.mode)}</h1><div class="muted">Fastest Lap · ${sec(r.fastestLap)}${r.overtime?' · Overtime '+sec(r.overtimeUs):''}</div></section><section class="card"><div class="result muted"><div>POSITION</div><div>RACER</div><div>LANE</div><div>RESULT</div><div>BEST LAP</div></div>${rows}<div class="actions"><button class="btn" id="details">DETAILS</button><button class="btn" id="history">HISTORY</button>${selectedHistorySequence?'':'<button class="btn primary" id="again">RACE AGAIN</button>'}</div><div id="extra"></div></section>`;if($('#again'))$('#again').onclick=()=>req('/request/race-again');$('#details').onclick=()=>{detailsData=null;detailsDataKey=null;V='details';render()};$('#history').onclick=()=>{historyData=null;V='history';render()}}
async function results(){let key=selectedHistorySequence||0;if(resultData&&resultDataKey===key){renderResults(resultData);return}let q=selectedHistorySequence?`?sequence=${selectedHistorySequence}`:'';try{let r=await G('/results'+q);if(!r?.sealed){resultData=null;resultDataKey=null;V='home';return home()}resultData=r;resultDataKey=key;renderResults(r)}catch(e){resultData=null;resultDataKey=null;if(V==='results'){V='home';note('No completed result is available.');home()}}}
async function practice(){if(practiceData){let r=practiceData;let rows=(r.entries||[]).map(e=>`<div class="result"><b>Racer ${e.raceEntryId}</b><div>Lane ${e.lane}</div><div>${e.laps} laps</div><div>${sec(e.bestLap)}</div><div></div></div>`).join('');A.innerHTML=`<section class="hero"><div class="eye">PRACTICE SUMMARY</div><h1>Open Practice</h1><div class="muted">Session Fastest · ${sec(r.sessionFastestLap)}</div></section><section class="card">${rows}<div class="actions"><button class="btn primary" id="again">PRACTICE AGAIN</button></div></section>`;$('#again').onclick=()=>req('/request/race-again');return}try{let r=await G('/practice-summary');if(!r?.available){practiceData=null;V='home';return home()}practiceData=r;return practice()}catch(e){practiceData=null;V='home';return home()}}
async function details(){let key=selectedHistorySequence||0;if(detailsData&&detailsDataKey===key){return renderDetails(detailsData)}let q=selectedHistorySequence?`?sequence=${selectedHistorySequence}`:'';try{let d=await G('/details'+q);detailsData=d;detailsDataKey=key;renderDetails(d)}catch(e){detailsData=null;detailsDataKey=null;if(V==='details'){V='home';note('Details are unavailable.');home()}}}
function renderDetails(d){A.innerHTML=`<section class="hero"><div class="eye">DETAILS</div><h1>Completed Session</h1></section><section class="card">${(d.entries||[]).map(e=>`<p><b>Racer ${e.mugId??'-'} · Lane ${e.lane}</b> · ${(e.records||[]).map(x=>'Lap '+x.lapNumber+' '+sec(x.lapTime)).join(' · ')||'No valid laps'}</p>`).join('')}<div class="actions"><button class="btn" id="backResults">RESULTS</button><button class="btn" id="history">HISTORY</button></div></section>`;$('#backResults').onclick=()=>{V='results';render()};$('#history').onclick=()=>{historyData=null;V='history';render()}}
async function history(){if(historyData){return renderHistory(historyData)}try{let h=await G('/history');historyData=h;renderHistory(h)}catch(e){historyData=null;V='home';note('History is unavailable.');home()}}
function renderHistory(h){A.innerHTML=`<section class="hero"><div class="eye">HISTORY</div><h1>Completed Sessions</h1></section><section class="card">${(h.entries||[]).map(x=>`<button class="btn historyItem" data-sequence="${x.sequence}"><b>Race ${x.sequence} · ${name(x.mode)}</b> · ${x.mode==='ENDURANCE'?x.durationMinutes+' min':x.lapTarget+' laps'}${(x.entries||[]).length?' · '+x.entries.map(e=>'Racer '+(e.mugId??'—')+' / Lane '+e.lane).join(' · '):''}</button>`).join('')||'<p>No completed races.</p>'}<div class="actions"><button class="btn" id="backResults">RESULTS</button></div></section>`;document.querySelectorAll('.historyItem').forEach(b=>b.onclick=()=>{selectedHistorySequence=Number(b.dataset.sequence);resultData=null;resultDataKey=null;V='results';render()});$('#backResults').onclick=()=>{selectedHistorySequence=null;resultData=null;resultDataKey=null;V='results';render()}}
function note(t){let n=$('#notice');n.textContent=t;n.classList.remove('hide');setTimeout(()=>n.classList.add('hide'),3000)}async function req(path,extra={},setup=false){if(busy)return;busy=true;render();let id=corr++,body={correlationId:id,...extra};try{let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(r.status!==202)throw Error();await wait(id)}catch(e){busy=false;note('That action could not be completed.');await poll()}}async function wait(id){for(let i=0;i<50;i++){await new Promise(r=>setTimeout(r,100));let x=await G('/request-result?correlationId='+id);if(x){busy=false;if(x.result!=='ACCEPTED')note(x.reason||'P&P rejected that action.');await poll();return}}busy=false;note('P&P has not confirmed that action.');await poll()}function render(){if(!S||!P)return;$('#overlay').innerHTML='';header();if(S.finishDisplay?.active)return race();if(S.lifecycle==='PAUSED')return paused();if(['STARTING','RACING','RESTARTING'].includes(S.lifecycle))return race();if(V==='practice')return practice();if(V==='results')return results();if(V==='setup')return setup();home()}async function poll(){if(polling)return;polling=true;try{[S,P,C]=await Promise.all([G('/state'),G('/proposal'),G('/context')]);if(!selectedHistorySequence&&S.lifecycle==='FINISHED'&&S.resultSealed&&resultData&&resultDataKey===0&&S.historySequence&&resultData.sequence&&resultData.sequence!==S.historySequence){resultData=null;resultDataKey=null}if(!selectedHistorySequence&&S.lifecycle!=='FINISHED'&&!S.resultSealed){resultData=null;resultDataKey=null;detailsData=null;detailsDataKey=null;if(V==='results'||V==='details')V='home'}if(S.practiceSummaryAvailable&&!selectedHistorySequence&&V!=='details'&&V!=='history')V='practice';else if(S.lifecycle==='FINISHED'&&!S.finishDisplay?.active&&!selectedHistorySequence&&!['details','history'].includes(V))V='results';render()}catch(e){$('#status').textContent='OFFLINE';$('#reason').textContent='Trying to reconnect'}finally{polling=false}}$('#logo').onclick=()=>{V='home';render()};$('#setupNav').onclick=()=>{V='setup';render()};$('#resultsNav').onclick=()=>{selectedHistorySequence=null;resultData=null;resultDataKey=null;V='results';render()};poll();setInterval(poll,1000);</script>
