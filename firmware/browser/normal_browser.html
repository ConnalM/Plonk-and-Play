<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plonk & Play</title>
<style>
:root{--bg:#09111c;--panel:#111c2b;--panel2:#172437;--line:#2a394d;--text:#f4f6f8;--muted:#9eacbd;--yellow:#ffd400;--danger:#ff6b6b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}.shell{max-width:1280px;margin:auto;padding:0 22px 30px}.top{height:78px;display:flex;align-items:center;gap:30px;border-bottom:1px solid var(--line)}.logo{font-weight:950;font-size:27px;font-style:italic;letter-spacing:-2px;cursor:pointer}.logo span{color:var(--yellow)}nav{display:flex;gap:25px;flex:1}nav button,.link{background:none;border:0;color:var(--muted);padding:10px 0;font:inherit;font-weight:700;cursor:pointer}nav button.active{color:var(--yellow);border-bottom:2px solid var(--yellow)}.statusbox{text-align:right}.statusline{font-weight:900;letter-spacing:.08em}.reason{font-size:12px;color:var(--muted);margin-top:3px}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:7px;padding:10px 16px;font:inherit;font-weight:800;cursor:pointer}.btn.primary{background:var(--yellow);border-color:var(--yellow);color:#111}.btn.ghost{background:transparent}.btn.danger{border-color:#743b43}.btn:disabled{opacity:.42;cursor:not-allowed}.hero{padding:54px 0 26px}.eyebrow{color:var(--yellow);font-size:13px;font-weight:900;letter-spacing:.13em}.hero h1{font-size:46px;line-height:1;margin:8px 0}.sub{color:var(--muted)}.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}.card h2{margin:0 0 16px;font-size:17px}.bigstart{width:100%;font-size:24px;padding:18px}.entries{display:grid;gap:8px}.entry{display:grid;grid-template-columns:75px 1fr 120px;align-items:center;background:var(--panel2);border-radius:8px;padding:12px}.lane{color:var(--yellow);font-weight:900}.muted{color:var(--muted)}.modes{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:20px}.mode{padding:10px 14px}.mode.on{border-color:var(--yellow);color:var(--yellow)}.mode.off{opacity:.35}.formrow{display:flex;gap:14px;align-items:center;margin:13px 0}.formrow label{min-width:150px;color:var(--muted)}input,select{background:#0c1623;border:1px solid var(--line);color:var(--text);padding:10px;border-radius:6px}.race{padding-top:22px}.pod{background:#050a10;border:1px solid #34455a;border-radius:20px 20px 8px 8px;padding:18px;text-align:center}.lamps{display:flex;justify-content:center;gap:13px}.lamp{width:42px;height:42px;border-radius:50%;background:#222;border:4px solid #101010}.lamp.red.on{background:#e63c3c;box-shadow:0 0 16px #e63c3c}.lamp.green.on{background:#43c768;box-shadow:0 0 16px #43c768}.podstate{font-weight:950;letter-spacing:.14em;margin-top:9px}.clock{font-size:64px;font-weight:950;text-align:center;padding:22px}.racebar{display:flex;justify-content:space-between;align-items:center;margin:14px 0}.table{border:1px solid var(--line);border-radius:10px;overflow:hidden}.tr{display:grid;grid-template-columns:80px 1.5fr 1fr 1fr 1fr 1fr;align-items:center;min-height:56px;padding:0 14px;border-top:1px solid var(--line)}.tr:first-child{border-top:0}.th{min-height:38px;color:var(--muted);font-size:12px;font-weight:800}.practice .tr{grid-template-columns:1.7fr 1fr 1fr 1fr}.finished{opacity:.65}.finishmark{color:var(--yellow);font-weight:900}.overlay{position:fixed;inset:0;background:#050a10cc;display:grid;place-items:center}.dialog{width:min(440px,90vw);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px;text-align:center}.dialog h2{font-size:30px}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.notice{position:fixed;right:20px;bottom:20px;background:var(--panel2);border:1px solid var(--line);padding:12px 16px;border-radius:8px;max-width:360px}.results h1{font-size:38px}.resultrow{display:grid;grid-template-columns:80px 1.4fr 80px 1fr 1fr;gap:8px;padding:14px;border-top:1px solid var(--line)}.hide{display:none!important}@media(max-width:800px){nav{display:none}.grid{grid-template-columns:1fr}.tr{font-size:13px}.hero h1{font-size:36px}}
</style>
<div class="shell"><header class="top" id="header"><div class="logo" id="logo"><span>P</span>&amp;<span>P</span></div><nav><button data-view="setup">Race Setup</button><button data-view="results">Results</button><button disabled>Track Setup</button><button disabled>Racers</button><button disabled>Settings</button></nav><div class="statusbox"><div class="statusline" id="headStatus">CONNECTING</div><div class="reason" id="headReason"></div></div></header><main id="app"></main></div><div id="overlay"></div><div id="notice" class="notice hide"></div>
<script>
let state=null,ctx=null,view='home',pending=false,nextCorrelation=1,lastResult=null;const $=s=>document.querySelector(s);const app=$('#app');
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const sec=u=>u?`${(Number(u)/1e6).toFixed(2)} s`:'—';const clock=u=>{let n=Math.max(0,Math.floor(Number(u||0)/1e6));return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`};
async function get(p){let r=await fetch(p,{cache:'no-store'});if(r.status===204)return null;if(!r.ok)throw Error(r.status);return r.json()}
function modeName(m){return m==='OPEN_PRACTICE'?'OPEN PRACTICE':m==='ENDURANCE'?'ENDURANCE':'LAP RACE'}
function entries(v=state){return (v?.entries||[]).map(e=>`<div class="entry"><div class="lane">LANE ${e.lane}</div><div><b>Racer ${e.raceEntryId}</b><div class="muted">Car identity</div></div><div>${e.laps||0} laps</div></div>`).join('')||'<div class="muted">No race entries</div>'}
function setHeader(){const active=state&&['STARTING','RACING','PAUSED','RESTARTING'].includes(state.lifecycle);$('#header').classList.toggle('hide',active);if(active)return;let ready=state?.lifecycle==='READY';$('#headStatus').textContent=ready?'READY':'NOT READY';$('#headReason').textContent=ready?'':'P&P is not currently startable';}
function home(){let m=modeName(state?.sessionMode),detail=state?.sessionMode==='ENDURANCE'?`${state.durationMinutes||1} MINUTES`:state?.sessionMode==='OPEN_PRACTICE'?'OPEN SESSION':`${state?.lapTarget||10} LAPS`;app.innerHTML=`<section class="hero"><div class="eyebrow">READY TO RACE</div><h1>${m}</h1><div class="sub">${detail}</div></section><div class="grid"><section class="card"><h2>Race Entries</h2><div class="entries">${entries()}</div></section><section class="card"><button class="btn primary bigstart" id="start">${pending?'STARTING…':'START'}</button><button class="link" id="change">Change Race</button><hr style="border-color:var(--line);border-width:1px 0 0;margin:22px 0"><div class="muted">Latest Result</div><div id="latest">${lastResult?.sealed?'Completed result available':'No recent result'}</div></section></div>`;$('#start').disabled=pending||!ctx?.hasMaster;$('#start').onclick=()=>start();$('#change').onclick=()=>{view='setup';render()}}
function setup(){app.innerHTML=`<section class="hero"><div class="eyebrow">RACE SETUP</div><h1>What are we racing?</h1></section><section class="card"><div class="modes"><button class="btn mode ${state?.sessionMode==='LAP_RACE'?'on':''}" data-mode="LAP_RACE">Lap Race</button><button class="btn mode ${state?.sessionMode==='OPEN_PRACTICE'?'on':''}" data-mode="OPEN_PRACTICE">Practice</button><button class="btn mode ${state?.sessionMode==='ENDURANCE'?'on':''}" data-mode="ENDURANCE">Endurance</button><button class="btn mode off" disabled>Timed Stage · Not yet available</button><button class="btn mode off" disabled>Drag · Not yet available</button></div><div id="modeFields"></div><h2 style="margin-top:28px">Race Entries</h2><div class="entries">${entries()}</div><p class="muted">Lane assignment and rotation use P&P's authoritative setup. Unsupported secondary options are deliberately omitted.</p><div class="actions"><button class="btn" id="backHome">Back</button><button class="btn primary" id="setupStart">START</button></div></section>`;document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>showModeFields(b.dataset.mode));$('#backHome').onclick=()=>{view='home';render()};$('#setupStart').onclick=()=>start();showModeFields(state?.sessionMode||'LAP_RACE')}
function showModeFields(m){let box=$('#modeFields');document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));if(m==='OPEN_PRACTICE')box.innerHTML='<div class="formrow"><label>Practice type</label><b>OPEN</b></div><div class="muted">No time limit. End the session when finished.</div>';else if(m==='ENDURANCE')box.innerHTML=`<div class="formrow"><label>Duration</label><input id="duration" type="number" min="1" max="999" value="${state?.durationMinutes||1}"> minutes</div><div class="formrow"><label>At zero</label><select id="finish"><option value="0">Stop at zero</option><option value="1" ${state?.finishBehaviour==='COMPLETE_CURRENT_LAP'?'selected':''}>Finish current lap</option></select></div>`;else box.innerHTML=`<div class="formrow"><label>Race distance</label><input id="laps" type="number" min="1" max="999" value="${state?.lapTarget||10}"> laps</div><div class="formrow"><label>Winner finishes</label><select id="finish"><option value="0">All stop immediately</option><option value="1" ${state?.finishBehaviour==='COMPLETE_CURRENT_LAP'?'selected':''}>Others finish current lap</option><option value="2" ${state?.finishBehaviour==='COMPLETE_FULL_RACE_DISTANCE'?'selected':''}>Others complete total laps</option></select></div>`;box.dataset.mode=m}
async function start(){let mode=$('#modeFields')?.dataset.mode||state?.sessionMode||'LAP_RACE',body={mode};if(mode==='ENDURANCE'){body.durationMinutes=Math.max(1,Math.min(999,Number($('#duration')?.value)||1));body.finishPolicy=Number($('#finish')?.value)||0}else if(mode==='LAP_RACE'){body.finishPolicy=Number($('#finish')?.value)||0}await request('/request/start','STARTING…',body)}
function race(){let practice=state.sessionMode==='OPEN_PRACTICE',endurance=state.sessionMode==='ENDURANCE';let rows=(state.entries||[]).map((e,i)=>practice?`<div class="tr"><b>Lane ${e.lane} · Racer ${e.raceEntryId}</b><div>${e.laps}</div><div>${sec(e.lastLapTime)}</div><div>${sec(e.bestLapTime)}</div></div>`:`<div class="tr"><div>${i+1}</div><b>Lane ${e.lane} · Racer ${e.raceEntryId}</b><div>${endurance?e.laps:`${e.laps} / ${state.lapTarget}`}</div><div>${sec(e.lastLapTime)}</div><div>${sec(e.bestLapTime)}</div><div>—</div></div>`).join('');let heads=practice?'<div class="tr th"><div>LANE / RACER</div><div>LAPS</div><div>LAST</div><div>BEST</div></div>':'<div class="tr th"><div>POSITION</div><div>LANE / RACER</div><div>'+(endurance?'LAPS':'PROGRESS')+'</div><div>LAST</div><div>BEST</div><div>GAP</div></div>';app.innerHTML=`<section class="race ${practice?'practice':''}"><div class="pod"><div class="lamps">${[0,1,2,3,4].map(()=>'<i class="lamp red"></i>').join('')}<i class="lamp green"></i></div><div class="podstate">${state.lifecycle==='STARTING'?'STARTING':practice?'PRACTICE':state.durationExpired?'TIME EXPIRED':state.lifecycle}</div></div>${endurance?`<div class="clock">${clock(state.remainingDuration)}</div>`:''}<div class="racebar"><b>${practice?'OPEN PRACTICE':endurance?'ENDURANCE · '+(state.finishBehaviour==='COMPLETE_CURRENT_LAP'?'FINISH CURRENT LAP':'STOP AT ZERO'):'LAP RACE'}</b><div>${state.lifecycle==='RACING'?`<button class="btn" id="pause">${pending?'PAUSING…':'PAUSE'}</button>${practice?` <button class="btn primary" id="endSession">${pending?'ENDING…':'END SESSION'}</button>`:''}`:''}</div></div><div class="table">${heads}${rows}</div></section>`;if($('#pause'))$('#pause').onclick=()=>request('/request/pause','PAUSING…');if($('#endSession'))$('#endSession').onclick=()=>request('/request/end-session','ENDING…');if(state.lifecycle==='STARTING')startLights();}
function startLights(){let lamps=[...document.querySelectorAll('.lamp.red')],green=$('.lamp.green');let reds=Number(state.redLightCount||5),gap=Number(state.redIntervalUs||0),delay=Number(state.finalDelayUs||0),first=Number(state.scheduledGo)-reds*gap-delay,now=Number(state.systemTime||0);let lit=gap?Math.max(0,Math.min(reds,Math.floor((now-first)/gap)+1)):0;lamps.forEach((l,i)=>l.classList.toggle('on',i<lit));if(now>=Number(state.scheduledGo||Infinity)&&state.startSignal===1)green.classList.add('on')}
function paused(){race();$('#overlay').innerHTML=`<div class="overlay"><div class="dialog"><h2>RACE PAUSED</h2><div class="actions"><button class="btn primary" id="resume">${pending?'RESUMING…':'RESUME'}</button><button class="btn" id="restart">RESTART</button><button class="btn danger" id="abandon">ABANDON</button></div></div></div>`;$('#resume').onclick=()=>request('/request/resume','RESUMING…');$('#restart').onclick=()=>destructive('/request/restart-race','/request/restart-race/confirm','Restart race');$('#abandon').onclick=()=>destructive('/request/end-race','/request/end-race/confirm','Abandon race')}
async function destructive(open,confirmPath,label){if(!confirm(`${label}?`))return;let id=nextCorrelation++;let a=await fetch(open,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({correlationId:id})});if(!a.ok)return notify(`${label} is unavailable.`);pending=true;render();let r=await fetch(confirmPath,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({correlationId:id})});if(r.status!==202){pending=false;notify(`${label} was not accepted.`)}else await awaitResult(id,label.toUpperCase()+'…')}
async function results(){let r=await get('/results');lastResult=r;if(r.mode==='OPEN_PRACTICE')return practiceSummary(r);let rows=(r.entries||[]).map(e=>`<div class="resultrow"><b>${e.tied?'=':''}${e.rank}</b><b>Racer ${e.raceEntryId}</b><div>Lane ${e.lane}</div><div>${e.completed?sec(e.completionTime):e.laps+' laps'}</div><div>${sec(e.bestLap)}</div></div>`).join('');app.innerHTML=`<section class="hero results"><div class="eyebrow">RESULTS</div><h1>${modeName(r.mode)}</h1><div class="sub">Fastest Lap · ${sec(r.fastestLap)}</div></section><section class="card"><div class="resultrow muted"><div>POSITION</div><div>RACER</div><div>LANE</div><div>RESULT</div><div>BEST LAP</div></div>${rows}<div class="actions" style="margin-top:20px"><button class="btn" id="details">DETAILS</button><button class="btn primary" id="again">RACE AGAIN</button></div></section>`;$('#again').onclick=()=>request('/request/race-again','PREPARING…');$('#details').onclick=()=>notify('Details remain available from P&P and are deliberately not expanded in the first Browser.')}
function practiceSummary(r){let rows=(r.entries||[]).map(e=>`<div class="resultrow"><b>Racer ${e.raceEntryId}</b><div>Lane ${e.lane}</div><div>${e.laps} laps</div><div>${sec(e.bestLap)}</div><div></div></div>`).join('');app.innerHTML=`<section class="hero results"><div class="eyebrow">PRACTICE SUMMARY</div><h1>Open Practice</h1><div class="sub">Session Fastest · ${sec(r.fastestLap)}</div></section><section class="card">${rows}<div class="actions"><button class="btn primary" id="again">PRACTICE AGAIN</button></div></section>`;$('#again').onclick=()=>request('/request/race-again','PREPARING…')}
function notify(t){let n=$('#notice');n.textContent=t;n.classList.remove('hide');setTimeout(()=>n.classList.add('hide'),3500)}
async function request(path,label,extra={}){if(pending)return;pending=true;render();let id=nextCorrelation++;try{let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({correlationId:id,...extra})});if(r.status!==202)throw Error('not submitted');await awaitResult(id,label)}catch(e){pending=false;notify('That action could not be completed.');await poll()}}
async function awaitResult(id,label){for(let i=0;i<50;i++){await new Promise(r=>setTimeout(r,100));let x=await get('/request-result?correlationId='+id);if(x){pending=false;if(x.result!=='ACCEPTED')notify(x.reason||'P&P rejected that action.');await poll();return}}pending=false;notify('P&P has not confirmed that action.');await poll()}
function render(){if(!state)return;$('#overlay').innerHTML='';setHeader();if(state.lifecycle==='PAUSED')return paused();if(['STARTING','RACING','RESTARTING'].includes(state.lifecycle))return race();if(state.lifecycle==='FINISHED'){view='results'}if(view==='setup'&&state.lifecycle==='READY')setup();else if(view==='results')results();else home()}
async function poll(){try{let [s,c]=await Promise.all([get('/state'),get('/context')]);state=s;ctx=c;if(state.lifecycle==='FINISHED')view='results';render()}catch(e){$('#headStatus').textContent='OFFLINE';$('#headReason').textContent='Trying to reconnect'}}
$('#logo').onclick=()=>{view='home';render()};document.querySelectorAll('nav [data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});poll();setInterval(poll,1000);
</script>
