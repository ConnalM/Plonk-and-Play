<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>P&amp;P · Drag design review</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#151a22;color:#f1f5fa;font:16px system-ui,Arial}button,input,select{font:inherit;color:inherit;background:#142337;border:1px solid #43546a;border-radius:7px;padding:11px;min-height:44px}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible{outline:2px solid #ffcf20}.review,header,nav,.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.review{padding:12px;background:#202732}.review small,.muted,label{color:#a8bacd}.shell{background:#000c19;max-width:1500px;margin:auto;min-height:680px}.shell[data-size=mobile]{max-width:390px}.shell[data-size=tablet]{max-width:768px}header{padding:16px 22px;border-bottom:1px solid #30455d}header strong{color:#ffcf20;font-size:24px}nav{flex:1}nav button{background:none;border:0}nav .active{color:#ffcf20;border-bottom:2px solid #ffcf20}.main{padding:22px}.panel{background:#101f32;border:1px solid #30455d;border-radius:10px;padding:18px;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.fields{display:flex;gap:12px;flex-wrap:wrap;align-items:end}.fields label{display:grid;gap:6px;flex:1;min-width:min(130px,100%)}.fields input,.fields select{width:100%;min-width:0;max-width:100%}.grid>*{min-width:0}.primary{background:#ffcf20;color:#101722;font-weight:900;border:0}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:#a8bacd}h1,h2,h3{margin:8px 0 16px}h1{font-size:clamp(24px,4vw,38px)}h2{font-size:20px}button.selected{border-color:#ffcf20;color:#ffcf20}.clock{font-size:clamp(44px,9vw,90px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.05;color:#ffcf20}.status{font-weight:800;color:#ffcf20}.danger{color:#ff6666}.green{color:#58e799}.lights{display:flex;gap:12px;justify-content:center;padding:15px}.lamp{width:34px;height:34px;display:inline-block;border-radius:50%;background:#334050;border:2px solid #607186}.lamp.red{background:#d72a36}.lamp.go{background:#2bd66c}.bezel{background:#050a10;border:5px solid #303439;border-radius:9px;padding:0;margin:12px auto;max-width:810px}.aux{width:800px;height:480px;background:#091521;display:flex;flex-direction:column;justify-content:space-between;padding:24px;color:white;overflow:hidden}.aux .clock{font-size:96px}.aux h2{font-size:34px}.auxwrap{overflow:auto}.aux .lights{padding:0}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}th,td{text-align:left;padding:12px;border-bottom:1px solid #30455d;white-space:nowrap}th{font-size:12px;color:#a8bacd;text-transform:uppercase}td.num,th.num{text-align:right}.diagram{width:100%;max-width:360px;height:105px}.badge{border:1px solid #43546a;padding:5px 9px;border-radius:5px}.strip{border-top:1px solid #30455d;padding-top:12px;color:#a8bacd}.shell[data-size=mobile] .grid{grid-template-columns:1fr}.shell[data-size=mobile] .main{padding:12px}.shell[data-size=mobile] header{padding:12px}.shell[data-size=mobile] nav{order:3;flex-basis:100%}@media(max-width:700px){.grid{grid-template-columns:1fr}.main{padding:12px}nav{order:3;flex-basis:100%}}details{margin-top:12px}summary{cursor:pointer;color:#ffcf20}p{line-height:1.45}

.dragLayout{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.treeLine{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:7px auto;max-width:260px}
.bigET{font-size:clamp(42px,9vw,100px);font-weight:800;font-variant-numeric:tabular-nums}
.dragTime{text-align:center}
.dragLayout{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);align-items:stretch}.treeLine{max-width:260px}.treeLine i{width:34px;height:34px;border:2px solid #657383;border-radius:50%;flex-shrink:0}.treeLine.dormant{opacity:.48}.dragTime{display:flex;flex-direction:column;justify-content:center;min-width:0}.bigET{line-height:1.1;font-size:clamp(48px,8vw,100px)}.dragTime .redHero{color:#ff4850;font-size:clamp(34px,6vw,64px);font-weight:900}.metric{font-variant-numeric:tabular-nums;font-size:clamp(22px,3vw,36px);font-weight:800}.track{display:block;width:100%;height:auto}.track text{font:14px system-ui;fill:white}.track .sensor{stroke:#ffcf20;stroke-width:4}.track .road{stroke:#667c91;stroke-width:20}.aux .dragLayout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:12px;flex:1;min-height:0}.aux .treeLine{margin:4px 0;max-width:265px;font-size:16px}.aux .treeLine i{width:28px;height:28px}.aux .bigET{font-size:76px}.aux .redHero{font-size:48px}.aux .metric{font-size:28px}.aux .panel{padding:10px}.aux .dragTime p{margin:4px 0}.aux .dragTime h2{margin:4px 0}.aux .strip{font-size:15px}.aux .tree h2{font-size:18px}.aux .treeLine:first-of-type{font-size:13px}.aux h2{margin:0 0 6px}.aux{padding:16px;gap:8px}.locked{color:#a8bacd}.review-note{font-size:13px;color:#a8bacd}.result-actions{justify-content:center}.field label{display:block}.fields label{min-width:0}.shell[data-size=mobile] .dragLayout:not(.aux .dragLayout){grid-template-columns:1fr}@media(max-width:700px){.dragLayout{grid-template-columns:1fr}.aux .dragLayout{grid-template-columns:300px minmax(0,1fr)}} 
.dragTime.redState .redHero{font-size:clamp(48px,8vw,100px);line-height:1.05;overflow-wrap:normal}.dragTime.redState .bigET{font-size:clamp(32px,4vw,56px)}.aux .dragTime.redState .redHero{font-size:52px}.aux .dragTime.redState .bigET{font-size:42px}.aux>div:first-child h2{font-size:26px;line-height:1.1}.aux .panel{margin:0;min-height:0}.aux .treeLine{margin:3px 0}.aux .dragTime{gap:3px}.aux .strip{padding-top:8px}.aux .bigET{white-space:nowrap}.aux .dragTime p{line-height:1.2}.aux .tree h2{margin:0 0 6px}.review select{max-width:100%}.review label{min-width:0}.review-note{overflow-wrap:anywhere}.treeLine.dormant i{background:#28313b!important}.redLayout .tree{min-width:0}.fields input:invalid{border-color:#ff6666}
</style></head><body>
<div class="review"><strong>GINA · DRAG REVIEW ONLY</strong><label>Viewport <select id="size"><option>desktop</option><option>tablet</option><option>mobile</option></select></label><label>Authority <select id="role"><option value="director">Race Director / SMUG</option><option value="mug">MUG · view only</option><option value="display">Display only</option></select></label><label>Simulated controller input <select id="signal"></select></label><button id="apply">Apply fixture signal</button><small id="signalNote" role="status"></small><small>Review-only simulation · no hardware, race engine, live timer or records.</small></div>
<div class="shell" id="shell"><header><strong>P&amp;P</strong><nav><button data-nav="setup" class="active">Race</button><button data-nav="results">Results</button><button data-nav="aux">Integrated Display</button></nav><span id="authority"></span></header><main class="main" id="main"></main></div>
<script>
'use strict';
const $=id=>document.getElementById(id),esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let role='director',route='setup',phase='setup',treeType='Sportsman',mug='Alex',course='',scale='',blocked=false,amber=0,red=false,reaction=null,et=null,trapHelp=false,history=[],serial=0,signalNote='Select a supplied detector or controller event.';
const signals=[['block','Start sensor blocked'],['clear','Start sensor cleared'],['amber','Next supplied amber signal'],['go','Supplied GO'],['cross','Start crossing'],['live','Supplied running ET'],['finish','Finish crossing'],['finishMissing','Finish without available ET']];
const allowed=(a)=>role==='director';
const btn=(label,a,primary=false)=>'<button class="'+(primary?'primary':'')+'" data-action="'+a+'" '+(!allowed(a)&&a!=='return'&&a!=='trap'?'disabled':'')+'>'+label+'</button>';
const opts=(arr,val)=>arr.map(x=>'<option '+(x===val?'selected':'')+'>'+esc(x)+'</option>').join('');
const fmt=v=>v==null?'—':Number(v).toFixed(2)+' s';
const result=()=>phase==='result';
const active=()=>!['setup','result'].includes(phase);
function resetRun(){signalNote='Await supplied Start sensor crossing.';phase='waiting';blocked=false;amber=0;red=false;reaction=null;et=null;trapHelp=false;serial++;route='run';}
function startTree(){if(phase!=='ready'||blocked)return false;phase='tree';amber=0;signalNote='Start sequence begun. Await supplied amber and GO signals.';return true}
function signal(a){
 // Scripted presentation inputs only. No real detector timing, countdown or persistence.
 if(phase==='waiting'&&(a==='block'||a==='cross')){blocked=true;phase='rollback';return true}
 if(phase==='rollback'&&a==='clear'){blocked=false;phase='ready';return true}
 if(phase==='ready'&&(a==='block'||a==='cross')){blocked=true;phase='rollback';return true}
 if(phase==='tree'&&a==='amber'&&amber<3){amber=treeType==='Pro'?3:amber+1;return true}
 if(phase==='tree'&&a==='go'&&amber===3){phase='go';return true}
 if(phase==='tree'&&(a==='cross'||a==='block')){red=true;reaction=-0.08;et=0;phase='running';return true}
 if(phase==='go'&&(a==='cross'||a==='block')){reaction=0.23;et=0;phase='running';return true}
 if(phase==='running'&&a==='live'){et=2.14;return true}
 if(phase==='running'&&(a==='finish'||a==='finishMissing')){et=a==='finishMissing'?null:red?6.71:6.84;phase='result';history.push(Object.freeze({serial,mug,treeType,red,reaction,et,course,scale}));return true}
 return false;
}
function status(){return {setup:'DRAG SETUP',waiting:'MOVE FORWARD TO STAGE',rollback:'ROLL BACK',ready:'READY',tree:'START SEQUENCE',go:'GO',running:red?'RED LIGHT · RUN':'RUN',result:red?'RED LIGHT':'RESULT'}[phase]}
function lamps(){return ['PRE-STAGE','STAGE','AMBER 1','AMBER 2','AMBER 3','GREEN','RED'].map((label,i)=>({label,on:i===1&&blocked&&phase==='rollback'?'#fff5ad':i>=2&&i<=4&&phase==='tree'&&(treeType==='Pro'?amber===3:i===amber+1)?'#ffb000':i===5&&!red&&['go','running','result'].includes(phase)?'#45d477':i===6&&red?'#ff4850':'#28313b',dormant:i===0}));}
function tree(){return '<section class="panel tree"><h2>'+esc(treeType)+' Christmas Tree</h2>'+lamps().map(l=>'<div class="treeLine '+(l.dormant?'dormant':'')+'"><span>'+l.label+(l.dormant?' · REU required':'')+'</span><i aria-label="'+l.label+' '+(l.on==='#28313b'?'unlit':'lit')+'" style="background:'+l.on+'"></i></div>').join('')+'</section>'}
function avg(c=course,time=et){return Number(c)>0&&time>0?(Number(c)/time*2.236936292).toFixed(1)+' mph':'—'}
function scaled(){return Number(scale)>0&&Number(course)>0&&et>0?(Number(course)*Number(scale)/et*2.236936292).toFixed(1)+' mph':'—'}
function track(){return '<svg class="track" viewBox="0 0 360 100" role="img" aria-label="Single lane: Sensor 1 start and Sensor 2 finish"><path class="road" d="M20 50 H340"/><path class="sensor" d="M90 26 V75 M300 26 V75"/><rect x="54" y="43" width="24" height="14" rx="3" fill="#58e799"/><text x="58" y="20">START</text><text x="267" y="20">FINISH</text><text x="58" y="92">Sensor 1</text><text x="267" y="92">Sensor 2</text></svg>'}
function setup(){if(result())return '<h1>Run complete</h1><div class="panel"><p>The completed result remains available. Choose NEW SETUP to change settings.</p><div class="actions">'+btn('RETURN TO RESULT','return',true)+btn('NEW SETUP','new')+'</div></div>';if(active())return '<h1>Run in progress</h1><div class="panel"><p>Setup is locked during a run.</p>'+btn('RETURN TO RUN','return',true)+'</div>';return '<div class="eyebrow">Race setup · V1 design review</div><h1>Drag</h1><div class="grid"><section class="panel"><h2>Racer</h2><label>MUG <select id="mug">'+opts(['Alex','Robin','Morgan'],mug)+'</select></label><h2>Base two-sensor mapping</h2>'+track()+'<p class="muted">Sensor 1 · Start / Sensor 2 · Finish (review mapping)</p></section><section class="panel"><h2>Drag setup</h2><div class="fields"><label>Start tree<select id="treeType">'+opts(['Sportsman','Pro'],treeType)+'</select></label><label>Optional course length (m)<input id="course" type="number" min="0" step="any" value="'+esc(course)+'"></label><label>Optional track scale (1:n)<input id="scale" type="number" min="1" step="any" value="'+esc(scale)+'"></label></div><p class="muted">Length is Start-to-Finish distance, not lap length. Unknown length or scale does not prevent Reaction or ET.</p>'+btn('STAGE','stage',true)+'</section></div>'}
function facts(aux=false){let show=result(),run=phase==='running';return '<section class="panel dragTime '+(red?'redState':'')+' '+(show?'resultState':'')+'>'+(red?'<div class="redHero">RED LIGHT</div>':'')+(!show&&!run?'<h2>'+status()+'</h2>':'')+(show||run||phase==='go'?'<div class="eyebrow">ELAPSED TIME (ET)</div><div class="bigET">'+fmt(et)+'</div>':'')+(['running','result','go'].includes(phase)?'<p>REACTION <span class="metric">'+fmt(reaction)+'</span></p>':'')+(show?'<p>AVG SPEED <span class="metric">'+avg()+'</span></p>':'')+(show&&et==null?'<p class="muted">ET unavailable · no derived speed</p>':'')+(show&&!aux&&Number(scale)>0&&Number(course)>0?'<p>Scale-equivalent distance '+(Number(course)*Number(scale)).toFixed(1)+' m · speed '+scaled()+'</p>':'')+(show?'<p class="locked">TRAP SPEED — REU required</p>'+(!aux?btn('Why is trap speed unavailable?','trap'):''):'')+(trapHelp&&!aux?'<p class="muted">REU Drag Sensor Pack adds the additional finish beam needed to measure speed through the final speed trap. Whole-run average speed is not trap speed.</p>':'')+(!show&&!run&&phase!=='go'?'<p class="muted">'+({waiting:'Move the car forward until the Start sensor is blocked.',rollback:'Roll back slightly until STAGE extinguishes.',ready:'Start sensor clear. Await the start sequence.',tree:'Watch the Christmas Tree.'}[phase]||'')+'</p>':'')+'</section>'}
function run(){return '<div class="eyebrow">Drag · '+esc(mug)+' · simulated controller snapshot</div><h1>'+status()+'</h1><div class="dragLayout '+(red?'redLayout':'')+'">'+tree()+facts()+'</div><div class="actions result-actions">'+(phase==='ready'?btn('START TREE','start',true):'')+(result()?btn('RACE AGAIN','again',true)+btn('NEW SETUP','new'):'')+'</div>'+(result()?'<p class="review-note">Production results are stored automatically. This review fixture writes no official records. No SAVE action.</p>':'')}
function results(){return '<h1>Drag results</h1><p class="muted">Session-local supplied review fixtures only · no official storage</p>'+(history.length?'<div class="tablewrap"><table><thead><tr><th>Run</th><th>MUG</th><th>Status</th><th>Reaction</th><th>ET</th><th>Avg speed</th></tr></thead><tbody>'+history.map(r=>'<tr><td>'+r.serial+'</td><td>'+esc(r.mug)+'</td><td>'+(r.red?'RED LIGHT':r.et==null?'ET unavailable':'Valid')+'</td><td>'+fmt(r.reaction)+'</td><td>'+fmt(r.et)+'</td><td>'+avg(r.course,r.et)+'</td></tr>').join('')+'</tbody></table></div>':'<p>No supplied completed runs.</p>')+(active()||result()?'<div class="actions">'+btn('RETURN TO RUN','return',true)+'</div>':'')}
function aux(){return '<h1>Integrated Display · 800 × 480</h1><p class="muted">Dedicated Drag view · read-only · simulated controller snapshot</p><div class="auxwrap"><div class="bezel" style="width:810px;max-width:none"><div class="aux"><div><div class="eyebrow">DRAG · '+esc(mug)+' · '+esc(treeType)+'</div><h2>'+status()+'</h2></div><div class="dragLayout '+(red?'redLayout':'')+'">'+tree()+facts(true)+'</div><div class="strip">Sensor 1 START · Sensor 2 FINISH · simulated facts</div></div></div></div>'}
function act(a){if(a==='return'&&(active()||result())){route='run';return true}if(a==='trap'&&result()){trapHelp=!trapHelp;return true}if(role!=='director')return false;if(a==='stage'&&phase==='setup'&&route==='setup'){resetRun();return true}if(a==='start'&&route==='run')return startTree();if(a==='again'&&result()){resetRun();return true}if(a==='new'&&result()){phase='setup';route='setup';blocked=false;amber=0;red=false;reaction=null;et=null;trapHelp=false;signalNote='Ready for a fresh setup; previous review rows remain separate.';return true}return false}
function render(){$('signalNote').textContent=signalNote;$('shell').dataset.size=$('size').value;$('authority').textContent=role==='director'?'SMUG · race authority':'VIEW ONLY';document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===route));$('main').innerHTML=({setup,run,results,aux})[route]();if(role!=='director')$('main').querySelectorAll('input,select').forEach(e=>e.disabled=true)}
$('signal').innerHTML=signals.map(([k,l])=>'<option value="'+k+'">'+l+'</option>').join('');
$('apply').onclick=()=>{let a=$('signal').value;if(signal(a)){signalNote='Accepted supplied signal: '+signals.find(x=>x[0]===a)[1]+'.';if(route!=='aux')route='run';}else signalNote='Ignored supplied signal: not applicable in '+status()+'.';render()};$('size').onchange=render;$('role').onchange=e=>{role=e.target.value;render()};
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.nav){route=b.dataset.nav;render();return}if(b.dataset.action&&act(b.dataset.action))render()});
document.addEventListener('change',e=>{if(role!=='director'||phase!=='setup'||route!=='setup')return;let v=e.target.value;switch(e.target.id){case 'mug':mug=v;break;case 'treeType':treeType=v;break;case 'course':course=Number(v)>0?v:'';break;case 'scale':scale=Number(v)>=1?v:'';break;default:return}});
render();
</script></body></html>
