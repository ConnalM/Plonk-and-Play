<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>P&P · Timed Stage design review</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#151a22;color:#f1f5fa;font:16px system-ui,Arial}button,input,select{font:inherit;color:inherit;background:#142337;border:1px solid #43546a;border-radius:7px;padding:11px;min-height:44px}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible{outline:2px solid #ffcf20}.review,header,nav,.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.review{padding:12px;background:#202732}.review small,.muted,label{color:#a8bacd}.shell{background:#000c19;max-width:1500px;margin:auto;min-height:680px}.shell[data-size=mobile]{max-width:390px}.shell[data-size=tablet]{max-width:768px}header{padding:16px 22px;border-bottom:1px solid #30455d}header strong{color:#ffcf20;font-size:24px}nav{flex:1}nav button{background:none;border:0}nav .active{color:#ffcf20;border-bottom:2px solid #ffcf20}.main{padding:22px}.panel{background:#101f32;border:1px solid #30455d;border-radius:10px;padding:18px;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.fields{display:flex;gap:12px;flex-wrap:wrap;align-items:end}.fields label{display:grid;gap:6px;flex:1;min-width:min(130px,100%)}.fields input,.fields select{width:100%;min-width:0;max-width:100%}.grid>*{min-width:0}.primary{background:#ffcf20;color:#101722;font-weight:900;border:0}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:#a8bacd}h1,h2,h3{margin:8px 0 16px}h1{font-size:clamp(24px,4vw,38px)}h2{font-size:20px}button.selected{border-color:#ffcf20;color:#ffcf20}.clock{font-size:clamp(44px,9vw,90px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.05;color:#ffcf20}.status{font-weight:800;color:#ffcf20}.danger{color:#ff6666}.green{color:#58e799}.lights{display:flex;gap:12px;justify-content:center;padding:15px}.lamp{width:34px;height:34px;display:inline-block;border-radius:50%;background:#334050;border:2px solid #607186}.lamp.red{background:#d72a36}.lamp.go{background:#2bd66c}.bezel{background:#050a10;border:5px solid #303439;border-radius:9px;padding:0;margin:12px auto;max-width:810px}.aux{width:800px;height:480px;background:#091521;display:flex;flex-direction:column;justify-content:space-between;padding:24px;color:white;overflow:hidden}.aux .clock{font-size:96px}.aux h2{font-size:34px}.auxwrap{overflow:auto}.aux .lights{padding:0}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}th,td{text-align:left;padding:12px;border-bottom:1px solid #30455d;white-space:nowrap}th{font-size:12px;color:#a8bacd;text-transform:uppercase}td.num,th.num{text-align:right}.diagram{width:100%;max-width:360px;height:105px}.badge{border:1px solid #43546a;padding:5px 9px;border-radius:5px}.strip{border-top:1px solid #30455d;padding-top:12px;color:#a8bacd}.shell[data-size=mobile] .grid{grid-template-columns:1fr}.shell[data-size=mobile] .main{padding:12px}.shell[data-size=mobile] header{padding:12px}.shell[data-size=mobile] nav{order:3;flex-basis:100%}@media(max-width:700px){.grid{grid-template-columns:1fr}.main{padding:12px}nav{order:3;flex-basis:100%}}details{margin-top:12px}summary{cursor:pointer;color:#ffcf20}p{line-height:1.45}
</style></head><body>
<div class="review"><strong>GINA · TIMED STAGE · REVIEW ONLY</strong><label>Viewport <select id="size"><option>desktop</option><option>tablet</option><option>mobile</option></select></label><label>Authority <select id="role"><option value="director">Race Director / SMUG</option><option value="mug">MUG · view only</option><option value="display">Display only</option></select></label><label>Simulated snapshot <select id="fixture"></select></label><small>No live sensors, timing engine, storage or official records.</small></div>
<div class="shell" id="shell"><header><strong>P&amp;P</strong><nav><button data-nav="setup" class="active">Race</button><button data-nav="stage">Results</button><button data-nav="matrix">Details</button><button data-nav="aux">Integrated Display</button></nav><span id="authority"></span></header><main class="main" id="main"></main></div>
<script>
'use strict';
const $=id=>document.getElementById(id), esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const names=['Alex','Robin','Morgan'];let roster=[...names],eventName='Borders Rally',geometry='loop',multi=true,stages=[{name:'Forest Loop',type:'loop',laps:3,runs:2,score:'best'},{name:'Hill Road',type:'ab',laps:1,runs:1,score:'all'}],eventOrder='stage',attemptOrder='round',dnf='fixed',dnfValue=120,falsePolicy='warning',penaltyValue=5,hold=3,route='setup',role='director',snapshot='ready',stageIndex=0,racer=0,attempt=1;let queue=[],cursor=0,active=false,falseSeen=false,splitTimer=null,completed=[],reviewPenalty=0,falseCount=0,loadedSlot=-1,fallback='fixed',fixedDnf=120,advancedOpen=false;
const fixtures={ready:{text:'READY',time:'00:00',lap:'0',note:'Position behind S/F or the mapped start sensor.'},countdown:{text:'START SEQUENCE',time:'00:00',lap:'0',reds:3,note:'Wait for GO.'},armed:{text:'GO · ARMED',time:'00:00',lap:'0',go:true,note:'First crossing starts official timing.'},running:{text:'RUNNING',time:'00:26',lap:'1',note:'Official stage clock running.'},split:{text:'LATEST SPLIT',time:'00:23.45',lap:'2',note:'Completed split held; live clock continues (simulated 00:48).'},afterSplit:{text:'RUNNING',time:'00:48',lap:'2',note:'Live clock resumes after split hold; completed split remains in the table.'},finish:{text:'FINISHED',time:'01:12.34',lap:'3',note:'Final crossing takes precedence over split hold.'},false:{text:'FALSE START',time:'00:00',lap:'0',note:'Sensor crossing before GO. Sanction follows configured policy.'},dnf:{text:'DNF',time:'—',lap:'1',note:'Unsuccessful attempt; later stages remain available.'},retry:{text:'RETRY · READY',time:'00:00',lap:'0',note:'Replaces unsuccessful attempt; not an extra counted attempt.'}};
const opts=(arr,val)=>arr.map(([k,t])=>'<option value="'+esc(k)+'" '+(val===k?'selected':'')+'>'+esc(t)+'</option>').join('');
const select=(id,arr,val)=>'<select id="'+id+'" '+(id==='attemptOrder'&&eventOrder==='mug'?'disabled':'')+'>'+opts(arr,val)+'</select>';
const field=(label,content)=>'<label>'+label+content+'</label>';
const num=(id,v,min=1)=>'<input id="'+id+'" type="number" min="'+min+'" value="'+v+'">';
const btn=(label,action,primary=false,guard=true)=>'<button class="'+(primary?'primary':'')+'" data-action="'+action+'" '+(guard&&role!=='director'?'disabled':'')+'>'+label+'</button>';
const current=()=>stages[stageIndex]||stages[0], racerName=()=>roster[racer]||'—';
function diagram(s){let loop=s.type==='loop',reverse=s.type==='ba';return '<svg class="diagram" viewBox="0 0 360 105" role="img" aria-label="'+(loop?'Circuit, car behind start finish':reverse?'Sensor B start, sensor A finish':'Sensor A start, sensor B finish')+'"><path d="'+(loop?'M100 23 H285 Q330 23 330 53 Q330 83 285 83 H75 Q30 83 30 53 Q30 23 75 23 H100':'M25 53 H335')+'" fill="none" stroke="#667c91" stroke-width="16"/><path d="M'+(reverse?290:100)+' 13 V93" stroke="#ffcf20" stroke-width="4"/>'+(!loop?'<path d="M'+(reverse?100:290)+' 13 V93" stroke="#58e799" stroke-width="4"/>':'')+'<rect x="'+(reverse?310:65)+'" y="'+(loop?16:46)+'" width="20" height="14" rx="3" fill="#58e799"/><text x="'+(reverse?255:80)+'" y="102" fill="white" font-size="12">'+(loop?'S/F':reverse?'B START':'A START')+'</text>'+(!loop?'<text x="'+(reverse?65:265)+'" y="12" fill="white" font-size="12">'+(reverse?'A FINISH':'B FINISH')+'</text>':'')+'</svg>';}
function buildQueue(){let q=[],ss=stages.slice(0,multi?stages.length:1);function add(i,j,k){q.push({stage:i,racer:j,attempt:k});}if(eventOrder==='mug'){roster.forEach((_,j)=>ss.forEach((s,i)=>{for(let k=1;k<=s.runs;k++)add(i,j,k)}));}else{ss.forEach((s,i)=>{if(attemptOrder==='round'){for(let k=1;k<=s.runs;k++)roster.forEach((_,j)=>add(i,j,k));}else roster.forEach((_,j)=>{for(let k=1;k<=s.runs;k++)add(i,j,k)});});}return q;}
function loadSlot(){let x=queue[cursor];if(!x)return;loadedSlot=cursor;falseCount=0;stageIndex=x.stage;racer=x.racer;attempt=x.attempt;falseSeen=false;reviewPenalty=0;snapshot='ready';setSnapshot('ready');}
function setSnapshot(k){if(active&&loadedSlot!==cursor)return false;if(snapshot==='false'&&k!=='countdown'&&k!=='false'&&k!=='dnf')return false;if(snapshot==='dnf'&&k!=='retry')return false;clearTimeout(splitTimer);if(k==='false'){falseSeen=true;falseCount++;if(falsePolicy==='dnf')k='dnf';}snapshot=k;if(k==='split')splitTimer=setTimeout(()=>{if(snapshot==='split'){snapshot='afterSplit';$('fixture').value=snapshot;render();}},hold*1000);$('fixture').value=snapshot;}
function mapping(s){return s.type==='loop'?'Track S/F · Sensor 1 (review fixture)':s.type==='ab'?'A · Sensor 1 → B · Sensor 2 (review fixture)':'B · Sensor 2 → A · Sensor 1 (review fixture)';}
function setup(){if(active)return '<h1>Event in progress</h1><div class="panel"><p>Setup is locked until the active event ends.</p><button data-action="returnRun" class="primary">RETURN TO RUN</button></div>';return '<div class="eyebrow">Race setup · post-V1 design</div><h1>Timed Stage</h1><div class="panel"><div class="fields">'+field('Initial geometry',select('geometry',[['loop','Loop'],['point','Point-to-Point']],geometry))+field('Format',select('format',[['single','Single Stage'],['multi','Multi-Stage Event']],multi?'multi':'single'))+field('Event name','<input id="eventName" value="'+esc(eventName)+'">')+'</div></div><div class="panel"><h2>MUGs</h2>'+names.map(n=>'<label style="margin-right:20px"><input type="checkbox" data-mug="'+n+'" '+(roster.includes(n)?'checked':'')+'> '+n+'</label>').join('')+'</div>'+stages.slice(0,multi?stages.length:1).map((s,i)=>'<section class="panel"><h2>Stage '+(i+1)+'</h2><div class="grid"><div><div class="fields">'+field('Name','<input data-stage="'+i+'" data-key="name" value="'+esc(s.name)+'">')+field('Geometry','<select data-stage="'+i+'" data-key="type">'+opts([['loop','Loop'],['ab','A → B'],['ba','B → A']],s.type)+'</select>')+(s.type==='loop'?field('Laps','<input type="number" min="1" data-stage="'+i+'" data-key="laps" value="'+s.laps+'">'):'')+field('Attempts','<input type="number" min="1" data-stage="'+i+'" data-key="runs" value="'+s.runs+'">')+field('Scoring','<select data-stage="'+i+'" data-key="score">'+opts([['all','All runs count'],['best','Best run counts']],s.score)+'</select>')+'</div>'+(multi&&i>0?btn('Move up','up:'+i,false)+btn('Remove','remove:'+i,false):'')+'</div><div>'+diagram(s)+'<p class="muted">'+mapping(s)+'</p></div></div></section>').join('')+(multi?btn('Add stage','add',false):'')+'<details class="panel" '+(advancedOpen?'open':'')+'><summary>Advanced</summary><div class="fields">'+field('Event organisation',select('eventOrder',[['stage','Stage order (default)'],['mug','MUG order']],eventOrder))+field('Attempt order',select('attemptOrder',[['round','All racers attempt 1, then 2'],['racer','Each racer completes all attempts']],attemptOrder))+field('DNF scoring',select('dnf',[['fixed','Fixed DNF time'],['slow','Slowest completed + penalty'],['exclude','Exclude from overall'],['retry','Retry at director discretion']],dnf))+field('Slowest completed additional penalty (s)',num('dnfValue',dnfValue,0))+field('Fixed DNF time / no-comparator fallback (s)',num('fixedDnf',fixedDnf,0))+(dnf==='retry'?field('Required fallback DNF rule',select('fallback',[['fixed','Fixed DNF time'],['slow','Slowest completed + penalty'],['exclude','Exclude from overall']],fallback)):'')+field('False start',select('falsePolicy',[['warning','Warning only (default)'],['penalty','Time penalty'],['dnf','Invalid attempt / DNF']],falsePolicy))+field('False-start penalty (s)',num('penaltyValue',penaltyValue,0))+field('Split hold (s)',num('hold',hold,0))+'</div><p class="muted">Retry replacement, no improvement retry for a valid completed run. MUG order overrides attempt order. Best Run ignores DNFs if a valid run exists; all DNF uses the configured fallback. Slowest + penalty without a comparator uses fixed DNF time.</p></details><div class="actions">'+btn('READY','ready',true)+'</div>';}
function lights(f){return '<div class="lights" aria-label="Authoritative simulated start signal">'+Array.from({length:5},(_,i)=>'<i class="lamp '+(f.go?'go':i<(f.reds||0)?'red':'')+'"></i>').join('')+'</div>';}
const splitRows=[['1','00:24.02',''],['2','00:23.45','00:23.45'],['3','00:24.87','']];
function splits(f){if(current().type!=='loop')return '<p class="muted">Point-to-point · no lap splits supplied.</p>';let count=f.text==='FINISHED'?current().laps:Math.min(Number(f.lap)||0,current().laps);return '<div class="tablewrap"><table><thead><tr><th>Lap</th><th class="num">Split</th><th class="num">Best</th></tr></thead><tbody>'+splitRows.slice(0,count).map(r=>'<tr><td>'+r[0]+'</td><td class="num">'+r[1]+'</td><td class="num">'+(r[2]||'—')+'</td></tr>').join('')+'</tbody></table></div>';}
function run(){let s=current(),f=fixtures[snapshot],time=f.time,pen=falseSeen&&falsePolicy==='penalty'?penaltyValue*falseCount+' s':'—';return '<div class="eyebrow">'+esc(eventName)+' · Stage '+(stageIndex+1)+' of '+(multi?stages.length:1)+'</div><h1>'+esc(s.name)+' · '+esc(racerName())+'</h1><div class="grid"><div class="panel"><div class="status '+(snapshot==='false'||snapshot==='dnf'?'danger':snapshot==='armed'?'green':'')+'">'+f.text+'</div><p class="muted">Attempt '+attempt+' of '+s.runs+' · '+mapping(s)+'</p>'+lights(f)+'<div class="clock">'+time+'</div><p>'+f.note+'</p>'+(snapshot==='split'?'<p class="muted">Hold '+hold+' seconds · exact split retained below</p>':'')+(s.type==='loop'?'<p>Lap '+Math.min(Number(f.lap),s.laps)+' / '+s.laps+'</p>':'')+'<div class="actions">'+(snapshot==='ready'||snapshot==='retry'?btn('START','countdown',true):'')+(snapshot==='dnf'?btn('RETRY','retry',true):'')+(snapshot==='finish'||snapshot==='dnf'?btn('RUN REVIEW','review',true):'')+(snapshot==='false'?'<span class="badge">'+esc(falsePolicy)+' · '+pen+'</span>'+btn('CONFIRM CAR POSITION · RESTART COUNTDOWN','restartCountdown',true):'')+'</div></div><div class="panel"><h2>Stage splits</h2>'+splits(f)+'</div></div>';}
function review(){if(active&&loadedSlot!==cursor)return classification(false);let valid=snapshot==='finish'&&!(falseSeen&&falsePolicy==='dnf');let sanction=(falseSeen&&falsePolicy==='penalty'?penaltyValue*falseCount:0)+reviewPenalty;let adjusted=(72.34+sanction).toFixed(2);let formatted=Math.floor(Number(adjusted)/60).toString().padStart(2,'0')+':'+(Number(adjusted)%60).toFixed(2).padStart(5,'0');return '<h1>Run review</h1><div class="panel"><h2>'+esc(racerName())+' · '+esc(current().name)+'</h2><div class="fields"><div>Raw time <div class="clock">'+(valid?'01:12.34':'—')+'</div></div><div>Penalty <h2>'+ (sanction?sanction.toFixed(2)+' s':'—')+'</h2></div><div>Adjusted time <h2>'+(valid?formatted:'—')+'</h2></div></div><p>'+ (valid?'Valid completed attempt · retry unavailable.':'Unsuccessful attempt · configured DNF scoring applies; if retry is declined or fails use '+esc(dnf==='retry'?fallback:dnf)+'.')+'</p>'+field('Director penalty (simulated supplied seconds)',num('reviewPenalty',reviewPenalty,0))+field('Penalty reason (review only)','<input id="annotation" placeholder="Reason / supplied sanction">')+'<div class="actions">'+(!valid?btn('RETRY ATTEMPT','retry',false):'')+btn('ACCEPT / NEXT ATTEMPT','next',true)+'</div></div>'+splits(fixtures[snapshot]);}
const results=[['1','Alex','01:12.34','00:05.00','02:17.34','—'],['2','Robin','01:15.20','—','02:21.20','00:03.86'],['3','Morgan','DNF','—','—','—']];
function sportingExamples(){return '<section class="panel"><h2>Approved sporting examples · supplied fixtures</h2><p>Best Run: DNF, 01:12.34, 01:17.34 → 01:12.34. All DNF → configured DNF rule. No completed comparator → fixed DNF time '+fixedDnf+' s. Retry declined or unsuccessful without further retry → '+esc(dnf==='retry'?fallback:dnf)+'; only final accepted attempt counts.</p><div class="tablewrap"><table><thead><tr><th>Position</th><th>MUG</th><th>Adjusted</th><th>Gap to leader</th></tr></thead><tbody><tr><td>1</td><td>Alex</td><td>01:12.34</td><td>—</td></tr><tr><td>1</td><td>Robin</td><td>01:12.34</td><td>00:00.00</td></tr><tr><td>3</td><td>Morgan</td><td>01:17.34</td><td>00:05.00</td></tr></tbody></table></div><p>Provisional interim example: Alex 2 stages, Robin 1 stage — no direct comparison or shared ranking.</p></section>';}
function classification(overall){return '<h1>'+(overall?'Event results':'Stage classification')+'</h1><p class="muted">Illustrative supplied result snapshot · not calculated from setup. Gap to leader. Interim standings provisional until all relevant stages complete. Accepted review slots: '+completed.length+' / '+queue.length+'.</p><div class="panel"><h2>Fastest · Alex (fixture)</h2><div class="tablewrap"><table><thead><tr>'+['Position','MUG','Stage time','Penalty','Timed Stage total','Gap to leader'].map(t=>'<th>'+t+'</th>').join('')+'</tr></thead><tbody>'+results.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table></div></div><div class="actions">'+(!overall&&active&&cursor<queue.length&&queue[cursor].stage!==stageIndex?btn('NEXT STAGE','nextStage',true):active?btn('RETURN TO RUN','returnRun',true,false):btn('EVENT RESULTS','overall',true))+btn('DETAILS','matrix',false,false)+(active?'':btn('NEW SETUP','setup',false))+'</div>'+sportingExamples();}
function matrix(){return '<h1>Detailed results</h1><p class="muted">Supplied example matrix · expandable lap splits</p><div class="tablewrap"><table><thead><tr><th>MUG</th><th>Forest Loop</th><th>Hill Road</th><th>Adjusted total</th></tr></thead><tbody><tr><td>Alex</td><td>01:12.34 + 5 s</td><td>01:00.00</td><td>02:17.34</td></tr><tr><td>Robin</td><td>01:15.20</td><td>01:06.00</td><td>02:21.20</td></tr><tr><td>Morgan</td><td>DNF</td><td>01:09.00</td><td>—</td></tr></tbody></table></div><details class="panel"><summary>Alex · Forest Loop · attempt 1 · lap splits</summary><table><thead><tr><th>Lap</th><th>Split</th><th>Best</th></tr></thead><tbody>'+splitRows.map(r=>'<tr>'+r.map(x=>'<td>'+(x||'—')+'</td>').join('')+'</tr>').join('')+'</tbody></table></details><div class="actions">'+btn('EVENT RESULTS','overall',false,false)+'</div>';}
function aux(){let f=fixtures[snapshot];if((cursor>0&&cursor===queue.length)||(active&&cursor>0&&queue[cursor]?.stage!==stageIndex)){return '<h1>Integrated Display · 800 × 480</h1><p class="muted">Supplied classification fixture · read only</p><div class="auxwrap"><div class="bezel" style="width:810px;max-width:none"><div class="aux"><div><div class="eyebrow">'+esc(eventName)+'</div><h2>'+(active?'Stage classification':'Event results')+'</h2><div class="status">'+(active?'Provisional · ':'')+'Fastest · Alex (fixture)</div></div><table><thead><tr><th>Position</th><th>MUG</th><th>Total</th><th>Gap to leader</th></tr></thead><tbody>'+results.map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[4]+'</td><td>'+r[5]+'</td></tr>').join('')+'</tbody></table><div class="strip">Simulated results · no official records</div></div></div></div>';}return '<h1>Integrated Display · 800 × 480</h1><p class="muted">Auxiliary display follows the supplied Browser snapshot; no race controls.</p><div class="auxwrap"><div class="bezel" style="width:810px;max-width:none"><div class="aux"><div><div class="eyebrow">'+esc(eventName)+' · STAGE '+(stageIndex+1)+' · ATTEMPT '+attempt+'</div><h2>'+esc(racerName())+' · '+esc(current().name)+'</h2><div class="status">'+f.text+'</div></div>'+lights(f)+'<div class="clock">'+f.time+'</div><div class="strip">'+(current().type==='loop'?'LAP '+Math.min(Number(f.lap),current().laps)+' / '+current().laps:mapping(current()))+' · '+esc(f.note)+'</div></div></div></div>';}
function render(){let d=$('main').querySelector?.('details');if(route==='setup'&&d)advancedOpen=d.open; $('authority').textContent=role==='director'?'SMUG · race authority':'VIEW ONLY';$('shell').dataset.size=$('size').value;document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===route));$('main').innerHTML=({setup,run,review,stage:()=>classification(false),overall:()=>classification(true),matrix,aux})[route]();if(role!=='director'||(active&&route==='setup'))$('main').querySelectorAll('input,select,button[data-action]').forEach(el=>{if(!['returnRun','matrix'].includes(el.dataset.action))el.disabled=true;});}
$('fixture').innerHTML=opts(Object.entries(fixtures).map(([k,v])=>[k,v.text]),snapshot);
$('fixture').onchange=e=>{setSnapshot(e.target.value);$('fixture').value=snapshot;if(route!=='aux'&&(!active||loadedSlot===cursor))route='run';render()};$('size').onchange=render;$('role').onchange=e=>{role=e.target.value;render()};
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.nav){route=b.dataset.nav;render();return;}let a=b.dataset.action;if(!a)return;if(a==='restartCountdown'){if(role!=='director'||snapshot!=='false'||loadedSlot!==cursor)return;setSnapshot('countdown');route='run';render();return;}if(a==='returnRun'){route=cursor>=queue.length||queue[cursor]?.stage!==stageIndex?'stage':(['finish','dnf'].includes(snapshot)?'review':'run');render();return;}if(role!=='director'&&!['matrix','overall'].includes(a))return;if(active&&route==='setup')return;if(a==='add'){stages.push({name:'Stage '+(stages.length+1),type:'loop',laps:1,runs:1,score:'all'});}else if(a.startsWith('up:')){let i=Number(a.split(':')[1]);[stages[i-1],stages[i]]=[stages[i],stages[i-1]];}else if(a.startsWith('remove:'))stages.splice(Number(a.split(':')[1]),1);else if(a==='ready'){if(active)return;if(!roster.length){alert('Select at least one MUG');return;}queue=buildQueue();cursor=0;completed=[];active=true;loadSlot();route='run';}else if(a==='countdown'||a==='retry'){if(!active||loadedSlot!==cursor)return;if(a==='countdown'&&!['ready','retry'].includes(snapshot))return;if(a==='retry'){if(snapshot!=='dnf'||!active||loadedSlot!==cursor)return;falseSeen=false;falseCount=0;reviewPenalty=0;}setSnapshot(a);route='run';}else if(a==='next'){if(!active||loadedSlot!==cursor||!['finish','dnf'].includes(snapshot))return;completed.push({...queue[cursor],status:snapshot,dnfRule:snapshot==='dnf'?(dnf==='retry'?fallback:dnf):null,penalty:(falseSeen&&falsePolicy==='penalty'?penaltyValue*falseCount:0)+reviewPenalty});cursor++;if(cursor>=queue.length){active=false;route='stage';}else if(queue[cursor].stage!==stageIndex){route='stage';}else{loadSlot();route='run';}}else if(a==='nextStage'){if(!active||cursor>=queue.length||queue[cursor].stage===stageIndex)return;loadSlot();route='run';}else if(['setup','run','review','stage','overall','matrix','aux'].includes(a))route=a;else return;$('fixture').value=snapshot;render();});
document.addEventListener('change',e=>{let el=e.target;if(role!=='director'||(active&&route==='setup'))return;if(el.dataset.mug){roster=names.filter(n=>document.querySelector('[data-mug="'+n+'"]').checked);return;}if(el.dataset.stage!==undefined){let s=stages[Number(el.dataset.stage)];s[el.dataset.key]=el.type==='number'?Math.max(1,Number(el.value)||1):el.value;render();return;}let v=el.value;switch(el.id){case 'geometry':geometry=v;stages[0].type=v==='loop'?'loop':'ab';break;case 'format':multi=v==='multi';break;case 'eventName':eventName=v;break;case 'eventOrder':eventOrder=v;render();break;case 'attemptOrder':if(eventOrder!=='mug')attemptOrder=v;break;case 'dnf':dnf=v;render();break;case 'fallback':fallback=v;break;case 'fixedDnf':fixedDnf=Math.max(0,+v);break;case 'dnfValue':dnfValue=Math.max(0,+v);break;case 'falsePolicy':falsePolicy=v;break;case 'penaltyValue':penaltyValue=Math.max(0,+v);break;case 'hold':hold=Math.max(0,+v);break;case 'reviewPenalty':reviewPenalty=Math.max(0,+v);render();break;default:return;}if(['geometry','format'].includes(el.id))render();});
render();
