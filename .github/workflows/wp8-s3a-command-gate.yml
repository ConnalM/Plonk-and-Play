name: WP8 S3a command gate host
on:
  pull_request:
    paths:
      - firmware/include/pp/taster_link_gate.h
      - acceptance/stage14c/taster_link_gate_test.cpp
      - .github/workflows/wp8-s3a-command-gate.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test standalone command gate prototype
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/include acceptance/stage14c/taster_link_gate_test.cpp -o /tmp/pp-s3a
          /tmp/pp-s3a
