name: WP8 S4 role manifest host

on:
  pull_request:
    paths:
      - firmware/include/pp/s4_role_manifest.h
      - firmware/include/pp/taster_link_platform_core_esp.h
      - firmware/include/pp/taster_link_platform_taster_esp.h
      - firmware/include/pp/taster_link_startup_common_esp.h
      - firmware/include/pp/taster_link_startup_core_esp.h
      - firmware/include/pp/taster_link_startup_taster_esp.h
      - firmware/include/pp/taster_link_startup_esp.h
      - firmware/include/pp/taster_link_socket_runtime.h
      - firmware/include/pp/taster_link_gate.h
      - firmware/wp7_idf_arduino_dbuf/CMakeLists.txt
      - firmware/wp7_idf_arduino_dbuf/cmake/pp_s4_role_profiles.cmake
      - firmware/src/wp8_role_compile_probe.cpp
      - firmware/src/wp8_core_role_compile_probe.cpp
      - firmware/src/wp8_taster_role_compile_probe.cpp
      - firmware/wp7_idf_arduino_dbuf/main/CMakeLists.txt
      - acceptance/stage14c/s4_role_manifest_test.cpp
      - acceptance/stage14c/s4_role_composition_source_test.cpp
      - acceptance/stage14c/s4_role_profile_cmake_test.cmake
      - acceptance/stage14c/taster_link_gate_test.cpp
      - .github/workflows/wp8-s4-role-manifest.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: S4 role-manifest contract
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/include acceptance/stage14c/s4_role_manifest_test.cpp -pthread -lcrypto -o /tmp/pp-s4
          /tmp/pp-s4
      - name: S4 inactive role-composition boundaries
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror acceptance/stage14c/s4_role_composition_source_test.cpp -o /tmp/pp-s4-composition
          /tmp/pp-s4-composition
      - name: S4 independent role build-profile contract
        run: cmake -P acceptance/stage14c/s4_role_profile_cmake_test.cmake
      - name: S3a command-gate regression
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/include acceptance/stage14c/taster_link_gate_test.cpp -o /tmp/pp-s3a
          /tmp/pp-s3a
