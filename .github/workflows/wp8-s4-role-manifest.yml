name: WP8 S4 role manifest host

on:
  pull_request:
    paths:
      - firmware/include/pp/s4_role_manifest.h
      - firmware/include/pp/taster_link_socket_runtime.h
      - firmware/include/pp/taster_link_gate.h
      - acceptance/stage14c/s4_role_manifest_test.cpp
      - acceptance/stage14c/taster_link_gate_test.cpp
      - .github/workflows/wp8-s4-role-manifest.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: S4 role-manifest contract
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/include acceptance/stage14c/s4_role_manifest_test.cpp -pthread -lcrypto -o /tmp/pp-s4
          /tmp/pp-s4
      - name: S3a command-gate regression
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/include acceptance/stage14c/taster_link_gate_test.cpp -o /tmp/pp-s3a
          /tmp/pp-s3a
