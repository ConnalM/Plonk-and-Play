name: Gina Drag Chromium review
on:
  push:
    branches:
      - gina/smugland-design
    paths:
      - 'design/smugland/PP_Drag_*'
      - '.github/workflows/gina-drag-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  drag-design-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser runtime
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run source regression
        run: node design/smugland/PP_Drag_regression.cjs | tee drag_source.log
      - name: Run browser and auxiliary regression
        shell: bash
        run: |
          set -o pipefail
          python design/smugland/PP_Drag_browser_regression.py | tee drag_browser.log
      - name: Preserve execution logs and auxiliary screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gina-drag-browser-evidence
          path: |
            drag_source.log
            drag_browser.log
            drag_screenshots/
          if-no-files-found: warn
