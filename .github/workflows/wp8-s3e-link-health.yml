name: WP8 S3e link health host
on:
  pull_request:
    paths:
      - firmware/include/pp/taster_link*.h
      - acceptance/stage14c/taster_link*_test.cpp
      - .github/workflows/wp8-s3e-link-health.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Clock freshness and client recovery
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/include acceptance/stage14c/taster_link_health_test.cpp -o /tmp/pp-s3e
          /tmp/pp-s3e
      - name: S3d authentication regression
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/include acceptance/stage14c/taster_link_handshake_test.cpp -lcrypto -o /tmp/pp-s3d
          /tmp/pp-s3d
      - name: S3c display regression
        run: |
          g++ -std=c++17 -DPP_MAX_ENTRIES=2 -Ifirmware/include acceptance/stage14c/taster_link_display_test.cpp -lcrypto -o /tmp/pp-s3c
          /tmp/pp-s3c
      - name: S3b wire regression
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/include acceptance/stage14c/taster_link_wire_test.cpp -lcrypto -o /tmp/pp-s3b
          /tmp/pp-s3b
      - name: S3a gate regression
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/include acceptance/stage14c/taster_link_gate_test.cpp -o /tmp/pp-s3a
          /tmp/pp-s3a
